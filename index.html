      "spoon-eyes": {
        ctx: "Entrei na Spoon Eyes, uma agência de multimédia de fotografia, vídeo, design, web, copywriting e drone, como estagiário em 2017 e continuei a trabalhar com a equipa depois do estágio, até 2020.",
        did: "Fui videógrafo e editor de vídeo, principalmente em casamentos. Fazia a captação das imagens no dia e a edição final no Adobe Premiere e no After Effects, do corte e ritmo à cor, ao som e aos grafismos.",
        out: "Três anos a contar histórias de casais em vídeo. Muitos dos trabalhos já não estão disponíveis na plataforma da agência; ficam aqui os que continuam online.",
        facts: [["3 anos", "de 2017 a 2020"], ["2", "ferramentas: Premiere e After Effects"], ["6", "vídeos de casamento em destaque"]],
        m: ["Alguns dos casamentos em que participei, da captação à edição. O Same Day Edit é um filme curto, montado para ser mostrado ao casal e aos convidados no próprio dia; o trailer resume a história do casamento em poucos minutos; o slideshow fotográfico junta as imagens do dia ao som da música. Clica numa capa para ver o vídeo no YouTube."] },
      "eva-explica": {
        ctx: "Foi um dos meus primeiros projetos. O centro de estudos Eva Explica precisava de uma identidade simples e fácil de reconhecer, que comunicasse estudo e educação, e de uma imagem para o espaço exterior.",
        did: "Desenvolvi um logótipo em preto e amarelo com um par de óculos, que remete para o estudo (e lembra o Harry Potter), e completei-o com padrões minimalistas e a informação essencial do centro, também no design exterior. A maquete 3D mostra a aplicação nas vitrines, com os padrões em amarelo e o logótipo no vidro, e a fotografia do espaço real fecha o projeto.",
        out: "Uma identidade única e memorável, de duas cores, aplicada do logótipo ao exterior do centro.",
        facts: [["2", "cores: preto e amarelo"], ["2019/20", "período"]],
        m: [""] },
      "essence-beauty": {
        ctx: "A Sofia Vasconçelos abriu o centro de estética Essence Beauty e precisava de uma marca elegante e de materiais de divulgação, incluindo a comunicação das regras de segurança durante a COVID-19.",
        did: "Criei um logótipo sofisticado que combina as iniciais da cliente com as da empresa, um cartão de visita com paleta baseada no rosa e dois flyers fiéis ao branding existente: um sobre os serviços do centro e outro sobre as regras de segurança adotadas por causa da COVID-19.",
        out: "Uma marca com personalidade e três peças coerentes entre si, incluindo um flyer que comunicou com clareza as regras de segurança em 2020.",
        facts: [["2", "flyers"], ["2018/20", "período"], ["COVID-19", "regras de segurança comunicadas"]],
        m: ["Um logótipo que une as iniciais da cliente às da empresa e dá origem a uma marca com personalidade. O cartão de visita usa uma paleta de tons rosa que reflete a elegância e a simplicidade do centro de estética e atrai o olhar com suavidade.",
            "Dois flyers distintos, ambos fiéis ao branding existente: o primeiro destaca os serviços disponíveis no centro de estética e o segundo detalha as regras de segurança aplicadas por causa da COVID-19, com comunicação clara e eficiente para as clientes."] }
    },
    en: {
      "swifttech": {
        ctx: "SwifTech is an online store under development by GroupTech, the group FalconTech also belongs to. As a new brand born in the digital space, it needed its own identity from day one: a logo that conveyed speed, precision and technology, and a set of rules to keep the store, social media and documents consistent with each other.",
        did: "I developed the full graphic identity and the manual, still in development, in five chapters: logo, typography, colour palette, graphic applications and stationery. I defined the main logo, the version without the slogan and the symbol (a swift with a pixelated wing), the clear space, the minimum size (69 px high and 204 px wide), the positive, negative, greyscale and two simplified versions, the rules for use on colour, photographic and gradient backgrounds and six examples of incorrect use. I set the typography (Exo 2 and Garet) and nine colours with Pantone, CMYK, RGB, HEX and RAL equivalents, and created the wallpapers and the email signature template. In parallel, I am developing the store's website in Shopify and planning the project and its tasks in Asana.",
        out: "A project in development since 2026. The manual is still in development and already covers logo, typography, colour, wallpapers and email signature; social media and newsletter are under review, and the business card, document templates, envelopes and folders are still to be done. The Shopify website is in development.",
        facts: [["5", "chapters in the manual"], ["9", "colours with Pantone, CMYK, RGB, HEX and RAL codes"], ["2", "typeface families: Exo 2 and Garet"], ["2026", "project start, in development"]],
        m: ["This interactive mockup is only an example, still in development, of how the SwifTech online store could look, selling video surveillance, video door phones, alarms, home automation and access control. It starts from the LojaTech structure and applies the SwifTech identity. Products, prices and texts are illustrative. You can browse, search, filter by category, open a product, add it to the cart and visit the other pages (technical support, contact, repairs, outlet, about us and checkout); there is no payment.",
            "The logo combines the symbol, a swift with a pixelated wing that blends the natural world with a digital aesthetic, the SwifTech lettering and the slogan «Click & Done». The main version serves contact points, digital, commercial and editorial use and must not be rebuilt from separate elements. The version without the slogan and the symbol on its own are simplified alternatives, to be used with care.",
            "On colour backgrounds the logo can be applied directly as long as there is contrast (I tested twelve backgrounds). On photographs no isolation box is needed and, without contrast, the application area is lightened or darkened. On gradients, the direction, intensity or tone is adjusted if legibility suffers.",
            "Besides the colour version, there are the positive version (black, for light backgrounds), the negative (white, for dark backgrounds) and the greyscale version, only when colour is technically not viable. There are also two single-colour simplified versions: main green, for backgrounds in the darker secondary tone, and secondary green, for backgrounds in the main tone.",
            "Six mistakes to avoid, A to F: distorted proportions, altered elements, changed typography, changed alignments, non-compliant shadows or effects and use on a background without enough contrast.",
            "The clear space is defined by the measure X and must stay free of graphic elements, text or backgrounds. The minimum size is 69 px high and 204 px wide; at low resolution, the logo must be scaled up proportionally.",
            "The wallpapers follow the manual's templates and are organised in folders by format: desktop, mobile and tablet.",
            "The email signature template is simple and consistent with the identity: thank-you message, name and role or team, institutional email, direct phone, general phone and website.",
            "Nine colours, each with Pantone, CMYK, RGB, HEX and RAL equivalents: the three institutional ones (lime green, dark green and near black), three variations for specific contexts and a scale of neutrals, from white to black, to support composition. The values are binding on any medium.",
            "Exo 2 is the institutional typeface, for headings and body text on every medium, digital, printed, institutional and commercial. It comes in nine weights, from Thin to Black.",
            "Garet is the secondary typeface, in five weights (Light to Black). It is used when the institutional typeface is not available, such as in shared documents or platforms with technical limitations, to keep communication legible and consistent.",
            "Under review: social media templates and newsletter. To do: business card, document templates, envelopes and folders."] },
      "arfit": {
        ctx: "In June 2024 I joined Arfit Climatização, an HVAC equipment company, as a Multimedia Technician, in the marketing department coordinated by Teresa Teixeira. The mission was to manage and evolve the brand's visual communication, consistently across every touchpoint: from the catalogue to email, from the software to social media, from the factory to events.",
        did: "I was responsible for the brand's visual communication, inside and outside the company. On commercial communication I developed the 2025 Technical Catalogue, one of the biggest projects, the 2025 Price List, flyers, magazine ads, the covers and footer of the proposals and documents issued from PHC, animated email signatures and newsletters. On social media I produced posts and reels for Instagram and, together with the team, collaborated on and supervised the launch campaign for the «Be On. Be Smart.» solution. I created the identity and the interface (UI) of the internal «ArfitSelect» software, where the wanted product was selected and its data consulted, focused on UX and aligned with the brand. I also gave graphic support to production and events: product labels, technical drawings for the production department, a custom film to wrap machines, Open Day badges, employee badges and Christmas and Easter materials. I worked with the technical and commercial teams to support marketing and sales strategies. I also managed the Arfit website through its back office, uploading all the documentation (catalogues, price lists and the rest of the technical and commercial documentation) and keeping it up to date for customers and partners.",
        out: "The work contributed to more consistent brand communication, a 35% increase in digital engagement and stronger commercial support through strategic materials. In the recommendation letter, the marketing manager points to the «Be On. Be Smart.» campaign as representative of my ability to execute, my visual thinking and my attention to brand positioning.",
        facts: [["+35%", "digital engagement"], ["12", "months, from June 2024 to June 2025"]],
        m: [
            "I designed posts for Arfit's Instagram on the brand's shared graphic system: diagonal blue and green shapes, the «PORTUGAL | arfit.pt» band and the logo in the footer, which makes every post recognisable at a glance. Within it there are several content lines: new products and range news (such as the low-profile unit and the CM3D digital controller), partnerships (Elektrovent), recognitions like the Selo ID, commemorative dates and seasonal messages (25 April, Easter, Valentine's Day, Season's Greetings) and the «Be On. Be Smart.» campaign, with its own, more technological visual language. The montage shows a selection; the communication also includes series such as «Dica Arfit» (Arfit tip), «Curiosidade Arfit» (Arfit fact) and «Projetos que falam por nós» (projects that speak for us), the «SACE Arfit solutions» and coverage of events, seminars and internal training.",
            "The reels follow the same language as the posts. Each cover names the topic with a large title over a photograph or graphic background, the diagonal shapes and the «PORTUGAL | arfit.pt» band. The six reels shown cover the «Be On. Be Smart.» solution, Arfit's anniversary, the Christmas Dinner, the Open Day, a machine from the factory («Innovation is the path to the future») and internal training. Click the play button on each cover to watch the reel on Instagram.",
            "«ArfitSelect» was an internal Arfit software tool used to select the specification of each product required and to present all of its data. I designed the logo, which combines a document and a spreadsheet with the ArfitSelect name, in the brand's blue and green palette, with the «by arfit» signature.",
            "I designed the interface pages of the «ArfitSelect» software, using the same blue-to-green gradient as the logo. The home page offers search by name and two ways to start: direct selection and guided selection. There are also the login, registration and password recovery pages, project management (a list of simulations with last modified and creation dates, and the actions view, delete and move location), the project and user detail pages, and a side menu with project, account and administration management (users, ranges, models, accessories and filters). The interface is available in Portuguese, Spanish, English and French. I show a montage of the pages here. I also prepared the site map, a 13-page document that organises the software into areas (home page, a reserved area for external and internal/admin users, and the selection area, direct and guided) and explains, page by page, what each one does: the available actions, the confirmation messages when deleting or saving, and the path between pages, marking which ones already existed and which were still to be created.",
            "Selection sheet as a PDF that could be downloaded for the product, shown here with the Plug EC. It has six pages: the cover and five content pages. Page 1 brings together the description, standards and certifications, advantages, accessories and components (motor, fan and filters). Page 2 shows the operating point, the performance curve and the operating data; page 3, the acoustic data, technical characteristics, article code and dimensions; page 4, the electrical diagram; and page 5, the ERP sheet. Every page has a header with the date, product, range, sub-range, unit reference and project, and a footer with contacts, user and version. I also defined the sheet's graphic standards to keep the PDFs consistent: Klavika typeface, the brand's blue and green palette, 1.3 cm margins and a 7 × 1.4 cm logo.",
            "Animated email signatures (GIF) for Arfit's communication, developed for the brand's communications, including the «Be On. Be Smart.» solution.",
            "Three Arfit newsletters. The first introduces the new «Be On. Be Smart.» product: the Be On module connects equipment to the Be Smart platform, enabling real-time remote monitoring of performance and maintenance, with automatic alerts. The second promotes the Open Day on 4 June 2025 at Arfit's headquarters, from 10:45 to 13:30 followed by lunch, with a visit to the PURE unit production line and a demonstration of the SACE solutions, with registrations open until 29 May. The third is the Christmas newsletter, inviting staff to the Christmas Dinner: RSVP by 6 December and the event on 13 December 2024 at 7 pm, at Quinta Geraldino in Maia. I handled the design and layout of all of them, from product and facility images and, for the Christmas one, an illustration in the brand colour palette with the Arfit symbol on a bauble.",
            "Mockup of the A5 flyer for the «Be On. Be Smart.» remote equipment monitoring solution.",
            "Mockup of a recruitment flyer for Arfit (bifold, outside and inside), presenting the company, its team structure and the incentives for new hires.",
            "Mockup of the folded flyer on Building Automation and SACE Solutions, with the «Solução Arfit» identity, outside and inside.",
            "The 2025 Technical Catalogue was one of the biggest projects I developed at Arfit, similar to the price list but far more complex. Each product has its own page, with a description, standards and certifications (such as TÜV Nord and Eurovent), benefits, components, accessories and technical specification tables with notes. I handled the structure and pagination, the information hierarchy and the visual identity of each product family, such as Air Handling and Condensing Units, and produced the catalogue in four languages: Portuguese, Spanish, French and English.",
            "Development and update of Arfit's 2025 Price List: a price catalogue available in four languages (Portuguese, Spanish, French and English), organised by product families, such as Ventilation and Recovery, with tables by model, reference and price, and dedicated rows for accessories. The new edition was promoted in the email signatures, pointing to updates available at arfit.pt.",
            "Ads developed for trade magazines in which Arfit advertised its products: one for «Edifícios e Energia», in a vertical format, and another for «O Instalador», in a horizontal format. Both promote Be Smart, with the message «The new era of monitoring starts today!»: all Arfit equipment connected directly to the cloud, fewer site visits, more control and real-time data, pointing to arfit.pt and a QR code. I adapted the same visual identity, with the Be.Smart logo and circuit lines, to both formats. I also designed an ad for the PICLIMA magazine, in a vertical format, with the message «Parabéns, PICLIMA! 20 anos de compromisso com o setor HVAC» (congratulations to PICLIMA on 20 years of commitment to the HVAC sector), under the tagline «Esteja dois passos à frente: Be On. Be Smart.».",
            "I designed the badges used to identify guests at Arfit Open Day events. Each badge includes a photo of the production floor, the «Open Day» title, the guest's name, the company, the event date (in the samples shown, 19 February 2025) and the arfit.pt address with the social networks. The sheets bring together several badges, one per guest, and I show two samples here. I blurred the names and companies to protect the guests' identity.",
            "I designed the badges used to identify each Arfit employee. Each badge has the brand symbol and the employee's name on two lines, in white over a wavy blue background, with the symbol in the green of the brand palette. The mockup shows a selection of badges. I blurred the names to protect the employees' identity.",
            "I designed the pattern of a custom film to wrap the machines that arfit supplies or develops. The film repeats the brand logo diagonally, in blue on a white background, and I prepared two scales of the same pattern: one with a smaller, repeated logo and one with a larger logo. The mockup simulates the film applied to two units and as a roll.",
            "I designed the covers for the commercial proposals produced in PHC, the platform used to prepare proposals for customers. I made versions for different areas: Support (maintenance contracts, remote supervision and warranty extension, under the Superior Performance message), arfit by Elektrovent (ventilation range), an English export version for the PURE hygienic air handling unit, and one for building automation and control systems (SACE Solutions). They share the same graphic structure, which keeps the proposals consistent, while each cover adapts image and message to the product.",
            "I also designed the footer for the documents issued from PHC. It brings together the certification seals (TÜV Rheinland ISO 9001:2015, Serviço Certificado and PME Líder 2024), the company details (Arfit Climatização S.A., tax ID 500 110 409) and the brands it represents: BlueBox by Swegon, FAST, arfit, Galletti and Bosch.",
            "I designed labels to be placed on arfit products, marked IN and OUT. Each one has an outer circle, an arrow pointing into or out of a circle, and the «by arfit®» signature. The drawing uses black outlines on white only.",
            "I designed explanatory technical drawings for the production department, one for each product indicated in the file name: PLUG EC 315, PLUG EC 190 / 220 / 250 and PLUG EC 315 II / 350 / 400 / 500 / 560. Each drawing shows the terminal block with its labels (such as 24V, 10V, GND, inputs, relay K1 and the L1, L2, L3/N and PE supply), the numbering of each connection and the wiring of the supply through the switch. The terminal layout changes from one product to the next, and each drawing follows its own. I also made a drawing with the dimensions of a unit, with the D, E and F measurements and the air inlet and outlet arrows, and the High EF Plus connection diagram, in Portuguese, which links the High EF outdoor unit, the Control Box and the AHU through electrical connections, liquid piping and gas piping. The diagram specifies the Olflex 3 x 1.5 mm² cable and the connections already made at the factory.",
            "Items developed for Arfit's 2024 Christmas: the Christmas card, with the message «Arfit wishes you Happy Holidays! We count on your company in 2025», and the A6 labels «To warm up the cold days… use without moderation!», both with the Arfit symbol on a Christmas bauble, in the brand blue and green.",
            "The Christmas Dinner menu for 13 December 2024, front and back: a velvety vegetable cream starter, a main course of pork loin Wellington with rice, drunken pear and vegetable julienne, a dessert buffet and coffee. It was printed on A4 sheets with five menus side by side.",
            "Solidarity Christmas: an A4 poster for the donation drive, with the Portuguese Red Cross logo, in the same Christmas identity.",
            "The roll-up and the teardrop flag, also developed for Arfit's Christmas, with the logo and the «your complete solutions» tagline on the brand blue background. The mockups show how they look on display.",
            "I designed the Easter tag that came with the gift given to employees. I kept the brand colours and combined the logo with an egg wearing bunny ears, over a pattern of Easter motifs and a strip of grass, with the message \"Feliz Páscoa!\" front and centre."
          ] },
      "lojatech": {
        ctx: "LojaTech was an online store project by GroupTech, the group that also includes FalconTech and SwifTech. As a new brand, it needed an identity of its own from day one, with a technological, recognisable look.",
        did: "In 2025 I developed the branding only: the graphic identity manual, in five chapters (logo, typography, colour palette, graphic applications and stationery). I defined the main logo, with and without slogan, and the symbol; the application rules (clear space, minimum size, colour versions, backgrounds and mistakes to avoid); the Neotech and Poppins typeface families; the colour palette, in red, black and white; and the graphic applications: wallpapers, social media templates, email signature and website template.",
        out: "Because of a domain rights conflict, the brand did not go ahead under this name and was redone as SwifTech. LojaTech therefore stayed at the branding stage: the manual covers the logo, typography, colour, wallpapers, social media, email signature and website template; newsletters and stationery were left to do.",
        facts: [["5", "manual chapters"], ["6", "colours with CMYK, RGB, HEX and RAL values"], ["2", "typeface families: Neotech and Poppins"], ["2025", "year of the project, branding only"]],
        m: ["The logo combines a symbol, a building connected to a circuit, with the LOJATECH lettering, in white and red, with a wireless-connection icon in the «O», and the slogan «Inova hoje... simplifica amanhã!» (innovate today... simplify tomorrow). The main version, horizontal and without slogan, is the recommended choice whenever possible. The version with the slogan is the brand's fullest expression and the simplified one, with the symbol only, is a fallback for small formats, monograms or very busy backgrounds, to be used sparingly.",
            "The clear space is defined by the measure X and must be kept free of graphic elements, text or backgrounds. The minimum size is 50 px high and 325.2 px wide for the version without slogan, and 85 px high and 430.4 px wide for the version with slogan; at low resolution, the logo should be scaled up proportionally.",
            "Besides the colour version, there is the positive (black, for light backgrounds), the negative (white, for dark backgrounds) and the greyscale, only when colour is not technically viable. There are also specific variations for coloured backgrounds.",
            "On coloured backgrounds, the logo is applied directly as long as there is contrast (I show twelve backgrounds). On photographs it needs no isolation box and, without contrast, the area of application is lightened or darkened. On gradients, the orientation, intensity or tone is adjusted if legibility is compromised.",
            "Six mistakes to avoid, A to F: distorted proportions, altered elements, changed typography, changed alignments, non-compliant shadows or effects, and use on a background without enough contrast.",
            "Neotech is the institutional typeface, for headings and body text on every medium, digital, printed, institutional and commercial. It comes in three weights: Light, Normal and Bold.",
            "Poppins is the secondary typeface, in five weights (Light to Black). It is used when the institutional typeface is not available, such as in shared documents or platforms with technical restrictions, to keep communication legible and coherent.",
            "Six colours, with CMYK, RGB, HEX and RAL values (and Pantone, where applicable): the three institutional ones (red #FF2C2C, near black #1A1A1A and white) and three variations for specific contexts (a darker red, #E60000, a dark grey, #262626, and a light grey, #F2F2F2).",
            "The wallpapers follow the manual's template and are organised in folders by format: desktop, mobile and tablet.",
            "Social media posts can be split into content series, such as photos, products and information, and must follow the supplied template in full. For visual variety, I also designed templates with inverted colours.",
            "The email signature template is simple and consistent with the identity: thank-you message, title (Customer Support Team), institutional email, phone contact, website and the institutional image. It must be plain text only, with the complementary image available for anyone who wants to copy the information easily.",
            "Template for the website's home page, with the message «Torna a tua casa mais segura e inteligente» (make your home safer and smarter) and the product category icons, on a dark background with the brand's red identity. Here I show the mockup.",
            "Newsletters and stationery were left to do: business card, document templates, envelopes, folders and clothing. The brand was later redone as SwifTech."] },
      "falcontech": {
        ctx: "FalconTech is a security and technology company in Vila Nova de Gaia, offering home automation, video surveillance, automation, alarms and intrusion detection, and monitoring. It is part of GroupTech, the group SwifTech, an online store in development, also belongs to. In June 2025 I joined as Marketing Manager to build the department from scratch, defining processes, tools and strategy.",
        did: "I defined the marketing and branding strategy and structured the department, with its processes and working tools. I plan and run digital marketing and offline communication, and manage internal projects in coordination with the technical and commercial teams. I implemented the CRM (HubSpot) and task management in Asana and Trello, for operational efficiency and commercial follow-up, and, since FalconTech is a growing startup, I also handle recruitment and selection: I define the role profiles, advertise the openings, screen applications and run interviews, select candidates and support their onboarding, including internships. I created the visual identity and brand guidelines that standardise internal and external communication. The graphic identity manual is the most complete example of that work: five chapters (logo, typography, colour palette, graphic applications and stationery), with the main logo, the simplified logo and the symbol, four colour versions, the clear space, the minimum size (80 px high without the slogan and 150 px with it), the rules for use on backgrounds and six examples of incorrect use. I set the typography (Work Sans and Montserrat) and six colours with Pantone, CMYK, RGB, HEX and RAL equivalents, and applied the system to wallpapers, social media, email signature, newsletter, business card, documents, deterrent signs and workwear.",
        out: "A contribution to a 40% increase in digital awareness and 30% growth in qualified leads. The brand also now has a single reference document, with measurements, colour codes and examples of mistakes, already covering eight types of application.",
        facts: [["5", "chapters in the manual"], ["6", "colours with Pantone, CMYK, RGB, HEX and RAL codes"], ["2", "typeface families: Work Sans and Montserrat"], ["8", "application types already created"]],
        m: [
            "A redesign proposal for the falcontech.pt website, only an example interactive mockup with no link to the official site. I started from the current site and kept its message and sections (the headline «Prevent the break-in, not just record it», the services, the PSP-SIGESP registration, «Request your quote now», «Why work with FalconTech» and «Give your home a new life»). What I improved: the headline now has a clear description, the looping GIF gave way to interactive examples (camera, alarm and gate; a home with light, blinds and «leaving home» mode), quote and fault requests take three steps, sections that were only headings now have content, the Portuguese was fixed and the stray link and duplicate labels were removed. I only used information from the current site (services, contacts and registration) and the colours and logo from the manual. The new texts are suggestions. You can switch between home and business, open each service, send an example quote request and see the mobile version.",
            "I selected the 2026 posts I find visually strongest and put them together in a mockup. The page now has series with their own language, such as Falcon Solutions (Hikvision equipment), Falcon Gear (security equipment), Falcon Secret Tips (tips) and awareness days (Smile Day, World Panic Day, Kindness Day). They share the brand blue or a white background, large typography, the product or person in focus and the website and logo in the footer.",
            "2026 reels in three video series, with covers numbered by episode and a graphic structure of their own for each series: Comercial, Instalações and Setup. They show the work on site (behind the scenes of two installations on the same day and a surprise visit to a site), a gate that opens by itself with an LPR camera and RFID access control, the Akuvox access control terminal, the preparation of a Hikvision camera before it reaches the customer and an answer to the question «what technology should your home have?». Clicking the play button on each cover opens the reel on Instagram.",
            "Between January and October 2026, FalconTech's social media grew on every platform: followers rose 53.7% on Instagram (from 1,264 to 1,943), 57.0% on Facebook (from 1,179 to 1,851) and 170.6% on LinkedIn (from 279 to 755).\nIn October, LinkedIn had the channel's best month, with 946 clicks, 6,975 views and 42 comments, and Facebook added 1,797 clicks.\nIn the paid Meta campaigns, the ads generated 2,595 leads over the same period, improving through October, with the month's best week at the end (84 leads).\nMonthly and weekly tracking, by network and by campaign, sets the next month's priorities.",
            "Post and story templates in three content categories (photos, products and information), each with an inverted-colour version, to add visual variety without leaving the identity.",
            "A newsletter on video surveillance with artificial intelligence: header with the symbol, banner, introductory text, a call-to-action block («Pedir o meu orçamento») and a footer with address, contacts and social networks.",
            "A text-only template, so recipients can copy the information, made up of a thank-you message, name and role, institutional email, phone, address, website and a complementary institutional image.",
            "Wallpaper templates for desktop, mobile and tablet, stored in separate folders by device.",
            "A black polo shirt with blue collar and cuffs, with the logo and the «Assistência técnica» label on the chest and back, developed to identify installers on site.",
            "A two-sided card: the dark front has the logo, the services (home automation, video surveillance, automation, alarms and intrusion detection, monitoring) and social networks; the light back holds the contact details. The example data is fictitious.",
            "Two versions with the same graphic model: one states that the premises are under video surveillance and the other that the alarm system is active. Both carry the phone number and website.",
            "Cover and back cover for commercial documents, on a dark background with the brand's mesh of dots and lines. The cover carries the title and the symbol; the back cover, the full logo, the website and social networks.",
            "The logo combines the symbol and the FALCONTECH lettering. The main logo includes the slogan «Segurança & Tecnologia», exists only in this configuration and must not be rebuilt from separate elements. The simplified logo, without the slogan, and the symbol on its own are fallback options, reserved for small formats, restricted technical areas or visually complex backgrounds.",
            "On colour backgrounds the logo can be applied directly as long as there is contrast (I tested twelve colours). On photographs, no isolation box is used and, when no version has enough contrast, the image area is lightened or darkened. On gradients, the direction, intensity or tone is adjusted if legibility suffers.",
            "Besides the colour version, for light and dark backgrounds, there are the positive version (black, for light backgrounds only), the negative (white, for dark backgrounds only) and the greyscale version, used only when colour is technically impossible and always from the official files.",
            "The clear space is defined by the measure X and must stay free of any graphic element, text or background. The minimum size is 80 px high (171.1 px wide) without the slogan and 150 px high (294.4 px wide) with the slogan.",
            "Six mistakes to avoid, labelled A to F: distorted proportions, altered elements, changed typography, changed alignments, shadows and effects, and use on a low-contrast background.",
            "Work Sans is the institutional typeface, in five weights (Light, Regular, Medium, Bold and Black), for headings and body text, in digital and printed media. Montserrat (Light, Normal and Bold) is the secondary typeface, for contexts where the institutional one is not viable, such as shared documents.",
            "Three institutional colours: blue #253D97 (Pantone 7686 C), blue-black #1B1E25 (Pantone 6 C) and very light blue #E9ECF9 (Pantone 656 C). Three variations: blue #3D77C4 (Pantone 2171 C), dark grey #323439 (Pantone 432 C) and white. Each colour has Pantone, CMYK, RGB, HEX and RAL equivalents, and no other shades are allowed."] },
      "special-casa": {
        ctx: "Special Casa is a real estate agency that needed a consistent social media presence, able to generate organic interaction with people looking to buy, sell or find a home.",
        did: "I defined a single visual line for all communication and designed the posts in Illustrator and Photoshop, organised into four content types: tips for buyers and sellers, property listings, consultant recruitment and seasonal dates such as São João. I planned and scheduled everything in Meta Business Suite and analysed the performance of each post to optimise the content that followed.",
        out: "Special Casa now communicates with a recognisable identity, and organic interaction is measured post by post, a basis for deciding which formats to repeat.",
        facts: [["4", "content types"], ["2023/24", "period"], ["3", "tools: Illustrator, Photoshop and Meta Business Suite"]],
        m: ["Social media posts with four goals: educate (tips for buying or selling a home), sell (property listings), recruit (consultants) and build closeness (seasonal communication, such as São João). Each type has its own graphic structure, so the audience recognises the brand before reading the text.",
            "Goal: keep a regular rhythm and understand what works.\nAction: I planned the posting calendar and scheduled the posts in Meta Business Suite, where I tracked the results of each one.\nResult: a steady publishing rhythm and content decisions backed by data."] },
      "btbc": {
        ctx: "BTBC (be true, be creative) offers social media management, graphic design and branding services. It needed an identity of its own that conveyed unity and creativity and worked from the logo to social media.",
        did: "I created a stylised brain as the symbol, defined four colours with meaning and two typefaces, and tested the logo in black and white to make sure it reads on any background. I then applied the system to the logo, newsletter, posts, stories, campaigns, flyers and business card, always in Illustrator and Photoshop.",
        out: "A complete identity system, applied coherently across five types of piece: logo, newsletter, social media, flyers and business card.",
        facts: [["4", "colours with meaning"], ["2", "typefaces"], ["5", "types of piece applied"], ["2023/24", "period"]],

  function initHome() {
    var works = document.querySelector(".hm-works");
    if (!works) return;
    var reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
    var fine = matchMedia("(hover: hover) and (pointer: fine)").matches && innerWidth > 700;
    var rows = [].slice.call(works.querySelectorAll(".hm-row"));
    var list = works.querySelector(".hm-list");
    var peek = works.querySelector(".hm-peek");
    var pimgs = [].slice.call(peek.querySelectorAll("img"));
    var cur = -1;

    function activate(i) {
      if (i === cur) return;
      cur = i;
      works.style.setProperty("--fl", rows[i].dataset.fl);
      works.style.setProperty("--fi", rows[i].dataset.fi);
      works.classList.add("on");
      rows.forEach(function (r, k) { r.classList.toggle("act", k === i); });
      pimgs.forEach(function (m, k) { m.classList.toggle("show", k === i); });
    }
    function clear() {
      cur = -1;
      works.classList.remove("on");
      rows.forEach(function (r) { r.classList.remove("act"); });
      pimgs.forEach(function (m) { m.classList.remove("show"); });
      peek.classList.remove("vis");
    }

    if (fine) {
      var tx = 0, ty = 0, x = 0, y = 0, raf = 0, running = false;
      var tick = function () {
        x += (tx - x) * 0.2; y += (ty - y) * 0.2;
        peek.style.transform = "translate3d(" + x.toFixed(1) + "px," + y.toFixed(1) + "px,0)";
        if (running) raf = requestAnimationFrame(tick);
      };
      var start = function () { if (!running) { running = true; raf = requestAnimationFrame(tick); } };
      cleanups.push(function () { running = false; cancelAnimationFrame(raf); });
      on(list, "mousemove", function (e) {
        var w = peek.offsetWidth, h = peek.offsetHeight;
        var px = e.clientX + 36;
        if (px + w > innerWidth - 16) px = e.clientX - 36 - w;
        tx = px; ty = Math.max(76, Math.min(e.clientY - h / 2, innerHeight - h - 16));
      });
      rows.forEach(function (r, i) {
        on(r, "mouseenter", function (e) {
          if (!peek.classList.contains("vis")) {
            var w = peek.offsetWidth, h = peek.offsetHeight, px = e.clientX + 36;
            if (px + w > innerWidth - 16) px = e.clientX - 36 - w;
            tx = x = px; ty = y = Math.max(76, Math.min(e.clientY - h / 2, innerHeight - h - 16));
            peek.style.transform = "translate3d(" + x + "px," + y + "px,0)";
          }
          activate(i); peek.classList.add("vis"); start();
        });
        on(r, "focus", function () { activate(i); });
      });
      on(list, "mouseleave", function () { clear(); running = false; });
      on(list, "focusout", function () { setTimeout(function () { if (!list.contains(document.activeElement)) clear(); }, 0); });
    } else {
      var pending = false;
      var pick = function () {
        pending = false;
        var wr = works.getBoundingClientRect();
        if (wr.bottom < 0 || wr.top > innerHeight) { if (cur > -1) clear(); return; }
        var lr = list.getBoundingClientRect(), mid = innerHeight * 0.5;
        if (lr.top > mid || lr.bottom < mid) { if (cur > -1) clear(); return; }
        var best = 0, bd = 1e9;
        rows.forEach(function (r, k) {
          var b = r.getBoundingClientRect(), d = Math.abs((b.top + b.bottom) / 2 - mid);
          if (d < bd) { bd = d; best = k; }
        });
        activate(best);
      };
      var sched = function () { if (!pending) { pending = true; requestAnimationFrame(pick); } };
      on(window, "scroll", sched, { passive: true });
      on(window, "resize", sched);
      sched();
    }

    // Frase de apresentação: as palavras acendem ao fazer scroll
    var st = document.querySelector(".hm-st");
    if (st) {
      var ws = [].slice.call(st.querySelectorAll(".w"));
      if (reduce) { ws.forEach(function (w) { w.classList.add("on"); }); }
      else {
        var pend2 = false;
        var upd = function () {
          pend2 = false;
          var r = st.getBoundingClientRect(), vh = innerHeight;
          var p = Math.max(0, Math.min(1, (vh * 0.85 - r.top) / (r.height + vh * 0.3)));
          var n = Math.round(p * ws.length);
          ws.forEach(function (w, k) { w.classList.toggle("on", k < n); });
        };
        var s2 = function () { if (!pend2) { pend2 = true; requestAnimationFrame(upd); } };
        on(window, "scroll", s2, { passive: true });
        on(window, "resize", s2);
        upd();
      }
    }

    // Números: contam até ao valor quando entram no ecrã
    var nums = [].slice.call(document.querySelectorAll(".hm-num"));
    if (!reduce && "IntersectionObserver" in window) {
      var io = new IntersectionObserver(function (es) {
        es.forEach(function (e) {
          if (!e.isIntersecting) return;
          io.unobserve(e.target);
          var el = e.target, to = +el.dataset.to, pre = el.dataset.pre || "", suf = el.dataset.suf || "", t0 = performance.now();
          var f = function (t) {
            var p = Math.min(1, (t - t0) / 1100), ease = 1 - Math.pow(1 - p, 3);
            el.textContent = pre + Math.round(to * ease) + suf;
            if (p < 1) requestAnimationFrame(f);
          };
          requestAnimationFrame(f);
        });
      }, { threshold: 0.6 });
      nums.forEach(function (n) { io.observe(n); });
      cleanups.push(function () { io.disconnect(); });
    }
  }

    var b = t.closest(".shot-btn"); if (b) openLb(+b.dataset.n);
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") { closeMenus(); if (!modal.hidden) closeModal(); else if (!lb.hidden) closeLb(); return; }
    if (lb.hidden) return;
    var k = current.indexOf(+lb.dataset.n);
    if (e.key === "ArrowRight" && k < current.length - 1) openLb(current[k + 1]);
    if (e.key === "ArrowLeft" && k > 0) openLb(current[k - 1]);
  });
</script>
</body>
</html>
