<style>
  /* Layout: página inicial com apresentação, botões coloridos e uma faixa por projeto.
     Página de projeto no estilo de galeria do Behance: título, coluna principal com os módulos
     (imagem + texto) e painel lateral fixo com contacto, informação, ferramentas e índice.
     Para formatar: altere as cores e fontes abaixo e os dados na lista PROJECTS no fim do ficheiro. */
  :root {
    --bg: #f3f4f5;
    --surface: #ffffff;
    --fg: #0b0c0e;
    --muted: #59636d;
    --accent: #0a6fb0;
    --accent-ink: #ffffff;
    --line: #d7dbde;
    --shadow: 0 1px 2px rgba(13, 34, 55, .10), 0 14px 36px rgba(13, 34, 55, .16);

    --font-display: "Bricolage Grotesque", "Helvetica Neue", Arial, sans-serif;
    --font-body: "Instrument Sans", "Helvetica Neue", Arial, sans-serif;

    --maxw: 1240px;
    --radius: 10px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0b0c0e; --surface: #16181b; --fg: #f3f4f5; --muted: #9aa4ad;
      --accent: #4cc3e0; --accent-ink: #06202b; --line: #26292d;
      --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 14px 36px rgba(0, 0, 0, .45);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0b0c0e; --surface: #16181b; --fg: #f3f4f5; --muted: #9aa4ad;
    --accent: #4cc3e0; --accent-ink: #06202b; --line: #26292d;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 14px 36px rgba(0, 0, 0, .45);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 16px; line-height: 1.55; margin: 0; padding: 0; }
  a { color: inherit; }
  button { font: inherit; }
  :focus-visible { outline: 3px solid currentColor; outline-offset: 3px; border-radius: 4px; }

  .in { max-width: var(--maxw); margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

  /* Topo (fixo ao fazer scroll) */
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: inherit; }
  .hdr { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); border-bottom: 1px solid color-mix(in srgb, currentColor 14%, transparent); }
  .stage .hdr { background: var(--c2); }
  .nav { display: flex; gap: 6px; }
  .nav button, .dd-b { background: transparent; border: 0; color: inherit; cursor: pointer; font-weight: 500; padding: 8px 10px; border-radius: 8px; }
  .nav button:hover { text-decoration: underline; text-underline-offset: 4px; }
  .nav { align-items: center; }
  .nav a[aria-current="page"] { text-decoration: underline; text-underline-offset: 4px; }
  .dd { position: relative; }
  .dd-b { display: inline-flex; align-items: center; gap: 7px; }
  .dd-b::after { content: ""; width: 7px; height: 7px; border-right: 2px solid currentColor; border-bottom: 2px solid currentColor; transform: translateY(-2px) rotate(45deg); transition: transform .2s ease; }
  .dd.open .dd-b::after { transform: translateY(1px) rotate(-135deg); }
  .dd-m { display: none; position: absolute; top: 100%; left: -6px; padding-top: 10px; z-index: 40; }
  .dd.open .dd-m { display: block; }
  @media (hover: hover) { .dd:hover .dd-m { display: block; } }
  .dd-in, .mpanel { background: var(--bg); color: var(--fg); }
  .stage .dd-in, .stage .mpanel { background: var(--c2); color: var(--ink); }
  .dd-in { min-width: 300px; padding: 8px; border-radius: 14px; border: 1px solid color-mix(in srgb, currentColor 18%, transparent); box-shadow: 0 18px 44px rgba(0, 0, 0, .28); display: flex; flex-direction: column; }
  .dd-in a, .mpanel a { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 9px; text-decoration: none; font-weight: 600; }
  .dd-in a:hover, .mpanel a:hover { background: color-mix(in srgb, currentColor 11%, transparent); }
  .dd-in a[aria-current="page"], .mpanel a[aria-current="page"] { background: color-mix(in srgb, currentColor 14%, transparent); }
  .dd-in i, .mpanel i { width: 12px; height: 12px; border-radius: 50%; flex: none; box-shadow: 0 0 0 1px color-mix(in srgb, currentColor 30%, transparent); }
  .dd-in .pn, .mpanel .pn { flex: 1; }
  .dd-in .py, .mpanel .py { font-size: .8rem; font-weight: 500; opacity: .65; white-space: nowrap; }
  .dd-in a.all, .mpanel a.all { margin-top: 4px; border-top: 1px solid color-mix(in srgb, currentColor 16%, transparent); border-radius: 0 0 9px 9px; padding-top: 14px; font-size: .92rem; }
  .menu-b { display: none; width: 40px; height: 40px; border-radius: 999px; border: 1px solid color-mix(in srgb, currentColor 28%, transparent); background: transparent; color: inherit; cursor: pointer; position: relative; padding: 0; flex: none; }
  .menu-b span, .menu-b span::before, .menu-b span::after { position: absolute; left: 50%; width: 16px; height: 2px; margin-left: -8px; background: currentColor; border-radius: 2px; transition: transform .2s ease, opacity .2s ease; }
  .menu-b span { top: 50%; margin-top: -1px; }
  .menu-b span::before, .menu-b span::after { content: ""; left: 0; margin-left: 0; }
  .menu-b span::before { top: -5px; }
  .menu-b span::after { top: 5px; }
  .hdr.mopen .menu-b span { background: transparent; }
  .hdr.mopen .menu-b span::before { transform: translateY(5px) rotate(45deg); }
  .hdr.mopen .menu-b span::after { transform: translateY(-5px) rotate(-45deg); }
  .mpanel { position: absolute; left: 0; right: 0; top: 100%; max-height: calc(100vh - 76px); max-height: calc(100dvh - 76px); overflow-y: auto; padding: 10px max(16px, env(safe-area-inset-left, 0px)) 22px; border-bottom: 1px solid color-mix(in srgb, currentColor 18%, transparent); box-shadow: 0 18px 30px rgba(0, 0, 0, .25); z-index: 45; }
  .mpanel[hidden] { display: none; }
  .mpanel .mk { margin: 8px 12px 4px; font-size: .74rem; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; opacity: .65; }
  .mpanel hr { border: 0; border-top: 1px solid color-mix(in srgb, currentColor 16%, transparent); margin: 10px 0; }
  .brand .b2 { white-space: nowrap; }
  @media (min-width: 761px) { .mpanel, .menu-b { display: none !important; } }

  .brand { display: inline-flex; align-items: center; gap: 12px; }
  .brand .mono { height: 1.5em; width: 3.4em; }
  .brand .bt { display: flex; flex-direction: column; }
  footer .mono { height: 1.4em; width: 3.2em; opacity: .9; margin-bottom: 10px; display: block; }
  .brand { font-family: var(--font-display); font-weight: 800; letter-spacing: .01em; text-decoration: none; font-size: 1.05rem; }
  .top-right { display: flex; align-items: center; gap: 18px; }
  .lang { display: inline-flex; align-items: center; gap: 2px; padding: 3px; border-radius: 999px; border: 1px solid color-mix(in srgb, currentColor 28%, transparent); }
  .lang button { background: transparent; border: 0; color: inherit; cursor: pointer; font: inherit; font-size: .78rem; font-weight: 600; letter-spacing: .08em; padding: 5px 10px; border-radius: 999px; opacity: .65; }
  .lang button:hover { opacity: 1; }
  .lang button[aria-pressed="true"] { opacity: 1; background: color-mix(in srgb, currentColor 16%, transparent); }
  .top-right .tag { opacity: .7; font-size: .8rem; letter-spacing: .1em; text-transform: uppercase; }

  /* Botões */
  .cta {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 0; cursor: pointer; text-decoration: none;
    font-weight: 600; font-size: .95rem; padding: 11px 20px; border-radius: 999px;
    background: var(--accent); color: var(--accent-ink); transition: transform .15s ease, filter .15s ease;
  }
  .cta:hover { transform: translateY(-2px); filter: brightness(1.1); }
  .cta.block { width: 100%; }

  /* Cor de cada projeto: --c1/--c2 (fundo), --ink (texto) */
  .tinted { background: linear-gradient(135deg, var(--c1), var(--c2)); color: var(--ink); }
  .tinted .btn, .btn {
    display: inline-flex; align-items: center; gap: 8px; text-decoration: none; font-weight: 600; font-size: .95rem;
    padding: 12px 20px; border-radius: 999px; background: var(--ink); color: var(--c1); transition: transform .15s ease, filter .15s ease;
  }
  .btn:hover { transform: translateY(-2px); filter: brightness(1.12); }

  /* Página inicial: tipografia enorme, base neutra, a cor vem só dos projetos */
  :root { --font-poster: "Anton", "Impact", "Arial Narrow", sans-serif; }
  .wide { max-width: 1680px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .hm-k { margin: 0; font-size: .78rem; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  .hm-h { font-family: var(--font-poster); font-weight: 400; text-transform: uppercase; font-size: clamp(3.2rem, 11vw, 9.5rem); line-height: .92; letter-spacing: -.005em; margin: 0; }
  .hm-sec { padding-block: clamp(64px, 9vw, 120px); scroll-margin-top: 70px; }

  /* Entrada */
  .hm-hero { padding-block: 26px 48px; }
  .hm-meta { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 6px 16px; }
  .hm-hgrid { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); grid-template-areas: "hi feat" "name feat" "lead feat"; grid-template-rows: auto auto 1fr; column-gap: clamp(28px, 5vw, 80px); row-gap: clamp(18px, 2.4vw, 32px); align-content: center; margin-top: clamp(20px, 3.4vw, 44px); }
  .hm-name { grid-area: name; align-self: start; font-family: var(--font-poster); font-weight: 400; text-transform: uppercase; font-size: clamp(2.6rem, 7.4vw, 8rem); line-height: .9; letter-spacing: -.01em; margin: 0; white-space: nowrap; }
  .hm-name .n { display: block; }
  .hm-name .n + .n { margin-left: clamp(24px, 6vw, 96px); color: transparent; -webkit-text-stroke: 1.5px var(--fg); }
  .hm-name .ch { display: inline-block; animation: rise .9s cubic-bezier(.2, .7, .2, 1) backwards; animation-delay: calc(var(--i) * 45ms); }
  @keyframes rise { from { transform: translateY(.28em); } }
  .hm-lead { grid-area: lead; align-self: start; margin: 0; max-width: 46ch; font-family: var(--font-body); font-weight: 400; font-size: clamp(1.08rem, 1.7vw, 1.4rem); line-height: 1.55; text-wrap: pretty; }
  .hm-fwrap { grid-area: feat; align-self: center; display: flex; flex-direction: column; align-items: flex-end; gap: clamp(18px, 2.4vw, 30px); }
  .hm-idx { list-style: none; margin: 0; padding: 0; width: 100%; border-top: 1px solid var(--line); }
  .hm-idx li { animation: up .7s cubic-bezier(.2, .7, .2, 1) backwards; animation-delay: calc(.35s + var(--i) * 90ms); }
  .hm-idx button { display: grid; grid-template-columns: 2.4rem minmax(0, 1fr) auto; align-items: center; gap: 12px; width: 100%; padding: clamp(10px, 1.4vw, 16px) 0; background: transparent; border: 0; border-bottom: 1px solid var(--line); color: inherit; cursor: pointer; text-align: left; font: inherit; transition: padding-left .3s ease, color .3s ease; }
  .hm-idx .i { font-size: .78rem; font-weight: 600; letter-spacing: .14em; color: var(--muted); }
  .hm-idx .w { font-family: var(--font-poster); text-transform: uppercase; font-size: clamp(1.9rem, 3.8vw, 3.4rem); line-height: 1.05; }
  .hm-idx .a { font-size: 1.4rem; opacity: 0; transform: translate(-6px, 6px); transition: opacity .3s ease, transform .3s ease; }
  .hm-idx button:hover, .hm-idx button:focus-visible { color: var(--accent); padding-left: 14px; }
  .hm-idx button:hover .a, .hm-idx button:focus-visible .a { opacity: 1; transform: none; }
  .hm-hi { grid-area: hi; align-self: end; margin: 0; font-size: clamp(1rem, 1.4vw, 1.2rem); color: var(--muted); }
  .hm-name .ch { transition: color .25s ease, -webkit-text-stroke-color .25s ease; }
  .hm-name .ch:hover { color: var(--accent); }
  .hm-name .n + .n .ch:hover { color: transparent; -webkit-text-stroke-color: var(--accent); }
  .hm-badge { flex: none; position: relative; width: clamp(104px, 11vw, 136px); aspect-ratio: 1; border: 0; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; cursor: pointer; }
  .hm-badge svg { position: absolute; inset: 0; width: 100%; height: 100%; transition: transform .9s cubic-bezier(.2, .7, .2, 1); }
  .hm-badge text { fill: currentColor; font: 600 10.5px var(--font-body); letter-spacing: .06em; }
  .hm-badge i { font-style: normal; font-size: 1.7rem; line-height: 1; transition: transform .3s ease; }
  .hm-badge:hover svg { transform: rotate(140deg); }
  .hm-badge:hover i { transform: translateY(5px); }

  /* Tira de capas */
  .hm-strip { overflow: hidden; padding-block: 8px 24px; }
  .hm-track { display: flex; gap: 16px; width: max-content; animation: slide 80s linear infinite; }
  .hm-strip:hover .hm-track { animation-play-state: paused; }
  .hm-cv { display: block; flex: none; }
  .hm-cv img { display: block; width: auto; height: clamp(140px, 19vw, 240px); }
  @keyframes slide { to { transform: translateX(calc(-50% - 8px)); } }

  /* Palavras-chave */

  /* Animações simples nas páginas de projeto */
  .pw { display: inline-block; overflow: hidden; vertical-align: top; padding-bottom: .12em; margin-bottom: -.12em; }
  .pw > span { display: inline-block; animation: wordup .8s cubic-bezier(.2, .7, .2, 1) backwards; animation-delay: calc(.1s + var(--i) * 90ms); }
  @keyframes wordup { from { transform: translateY(108%); } }
  @keyframes wipe { from { clip-path: inset(0 0 100% 0); } to { clip-path: inset(-40px); } }
  @keyframes zoomout { from { transform: scale(1.12); } }
  .hero-img .shot-btn { animation: wipe 1.1s .25s cubic-bezier(.2, .7, .2, 1) backwards; }
  .hero-img .shot-btn img { animation: zoomout 1.6s .25s cubic-bezier(.2, .7, .2, 1) backwards; }
  .module .shot-btn.rv { opacity: 1; transform: none; clip-path: inset(0 0 100% 0); transition: clip-path 1s cubic-bezier(.2, .7, .2, 1); }
  .module .shot-btn.rv.vis { clip-path: inset(-40px); }
  .module .shot-btn.rv img { transform: scale(1.12); }
  .module .shot-btn.rv.vis img { transform: scale(1); transition: transform 1.4s cubic-bezier(.2, .7, .2, 1); }

.shop-chrome{display:flex;align-items:center;gap:6px;padding:9px 12px;background:#e4e7e5}
.shop-chrome span{width:10px;height:10px;border-radius:50%;background:#b9bfbb}
.shop-chrome em{margin-left:10px;flex:1;background:#fff;border-radius:999px;padding:3px 12px;font:12px/1.4 system-ui,sans-serif;color:#555;font-style:normal;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sh-app{position:relative;container-type:inline-size;height:720px;overflow:hidden;background:#fff}
.sh-app *{box-sizing:border-box}
.sh-app :where(button){font-family:inherit;cursor:pointer;color:inherit}
.sh-app h2,.sh-app h3{margin:0}
.sh-scroll{height:100%;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin}
.sh-head{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;background:#162918;color:#fff;padding:12px 24px}
.sh-logo{background:none;border:0;padding:0;display:flex}
.sh-logo img{height:38px;width:auto;display:block}
.sh-nav{display:flex;align-items:center;gap:4px;margin-right:auto}
.sh-nav>button,.sh-dd>button{background:none;border:0;color:#fff;font-weight:600;font-size:14px;white-space:nowrap;padding:8px 12px;border-radius:8px}
.sh-nav>button:hover,.sh-dd>button:hover,.sh-nav [aria-current]{background:rgba(145,223,54,.16);color:#91DF36}
.sh-dd{position:relative}
.sh-ddm{display:none;position:absolute;left:0;top:100%;min-width:210px;background:#fff;border-radius:10px;padding:6px;box-shadow:0 14px 30px rgba(0,0,0,.25);z-index:6}
.sh-dd.open .sh-ddm{display:flex;flex-direction:column}
.sh-ddm button{background:none;border:0;text-align:left;padding:9px 12px;border-radius:7px;font-size:14px;font-weight:500;color:#0F1A10}
.sh-ddm button:hover{background:#eef7e3}
.sh-se{display:flex;align-items:center;gap:8px;background:#fff;color:#0F1A10;border-radius:999px;padding:0 14px;height:38px;width:200px;flex:0 1 200px;min-width:0}
.sh-se .ic{width:18px;height:18px;flex:none}
.sh-se input{border:0;outline:0;background:none;font:500 14px "Exo 2",system-ui,sans-serif;width:100%;min-width:0;color:#0F1A10}
.sh-se:focus-within{outline:2px solid #91DF36;outline-offset:2px}
.sh-ct,.sh-mb{position:relative;background:none;border:0;color:#fff;padding:6px;display:flex;border-radius:8px}
.sh-ct .ic,.sh-mb .ic{width:26px;height:26px}
.sh-ct b{position:absolute;right:-4px;top:-4px;background:#91DF36;color:#0F1A10;font-size:11px;min-width:19px;height:19px;border-radius:999px;display:grid;place-items:center}
.sh-ct.bump{animation:shb .4s}
@keyframes shb{40%{transform:scale(1.25)}}
.sh-mb{display:none}
.sh-hero{position:relative;background:#0F1A10;aspect-ratio:1600/600}
.sh-sl{position:absolute;inset:0;border:0;padding:0;background:none;opacity:0;transition:opacity .7s;pointer-events:none}
.sh-sl.on{opacity:1;pointer-events:auto}
.sh-sl img{width:100%;height:100%;object-fit:cover;display:block}
.sh-ar{position:absolute;top:50%;transform:translateY(-50%);width:40px;height:40px;border-radius:50%;border:0;background:rgba(15,26,16,.6);color:#fff;font-size:24px;line-height:1;z-index:2}
.sh-ar:hover{background:#91DF36;color:#0F1A10}
.sh-ar.l{left:12px}.sh-ar.r{right:12px}
.sh-dots{position:absolute;left:0;right:0;bottom:10px;display:flex;justify-content:center;gap:8px;z-index:2}
.sh-dots button{width:10px;height:10px;border-radius:50%;border:0;padding:0;background:rgba(255,255,255,.55)}
.sh-dots button[aria-current]{background:#91DF36;width:26px;border-radius:999px}
.sh-perks{list-style:none;margin:0;padding:18px 24px;display:grid;grid-template-columns:repeat(3,1fr);gap:14px;background:#eef7e3}
.sh-perks li{display:flex;align-items:center;gap:12px;font-size:13px;color:#2c3d2d}
.sh-perks b{display:block;font-size:15px;color:#0F1A10}
.sh-perks .ic{width:34px;height:34px;color:#162918;flex:none}
.sh-sec{padding:30px 24px 6px}
.sh-sec h2{font-size:24px;font-weight:800;letter-spacing:-.01em}
.sh-sh{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.sh-lk{background:none;border:0;font-weight:700;font-size:14px;color:#1f7a2b;padding:6px 0;text-decoration:underline;text-underline-offset:3px}
.sh-lk:hover{color:#0F1A10}
.sh-cats{list-style:none;margin:16px 0 0;padding:0;display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.sh-cats button{width:100%;background:#fff;border:1.5px solid #dfe6dc;border-radius:14px;padding:18px 8px;display:flex;flex-direction:column;align-items:center;gap:12px;font-size:14px;transition:transform .25s,border-color .25s,box-shadow .25s}
.sh-cats button:hover{transform:translateY(-4px);border-color:#91DF36;box-shadow:0 10px 22px rgba(22,41,24,.14)}
.sh-cic{width:68px;height:68px;border-radius:50%;background:#162918;color:#91DF36;display:grid;place-items:center}
.sh-cic .ic{width:36px;height:36px}
.sh-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.sh-card{border:1.5px solid #dfe6dc;border-radius:14px;overflow:hidden;background:#fff;display:flex;flex-direction:column;transition:box-shadow .25s,transform .25s}
.sh-card:hover{box-shadow:0 12px 26px rgba(22,41,24,.15);transform:translateY(-3px)}
.sh-ph{position:relative;border:0;background:linear-gradient(145deg,#eef7e3,#d6ecbd);aspect-ratio:1/.82;display:grid;place-items:center;color:#162918;padding:0}
.sh-ph .ic{width:34%;height:auto}
.sh-tag{position:absolute;left:10px;top:10px;background:#162918;color:#91DF36;font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px}
.sh-ci{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
.sh-cc{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#3f6b2a}
.sh-ci h3{font-size:14px;font-weight:600;line-height:1.35}
.sh-ci h3 button{background:none;border:0;padding:0;text-align:left;font:inherit}
.sh-ci h3 button:hover{text-decoration:underline}
.sh-pr{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:8px;padding-top:8px}
.sh-pr strong{font-size:17px}
.sh-add{white-space:nowrap;background:#91DF36;color:#0F1A10;border:0;border-radius:999px;font-weight:700;font-size:12px;padding:8px 12px;transition:background .2s,transform .2s}
.sh-add:hover{background:#162918;color:#91DF36}
.sh-add:active{transform:scale(.96)}
.sh-add.big{font-size:15px;padding:13px 22px;width:100%}
.sh-mini{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding-bottom:30px}
.sh-mini button{border:0;padding:0;border-radius:14px;overflow:hidden;background:none;display:block;transition:transform .3s}
.sh-mini button:hover{transform:scale(1.015)}
.sh-mini img{width:100%;height:auto;display:block}
.sh-chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}
.sh-chips button{border:1.5px solid #cfd9cb;background:#fff;border-radius:999px;padding:7px 14px;font-size:13px;font-weight:600}
.sh-chips button[aria-current]{background:#162918;color:#91DF36;border-color:#162918}
.sh-so{font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px}
.sh-so select{font:500 13px "Exo 2",system-ui,sans-serif;padding:7px 10px;border-radius:8px;border:1.5px solid #cfd9cb;background:#fff;color:#0F1A10}
.sh-sub{margin:0 0 14px;font-size:13px;color:#4a5a4b}
.sh-none{padding:24px 0;color:#4a5a4b}
.sh-list{padding-bottom:30px}
.sh-pd{padding-bottom:30px}
.sh-pg{display:grid;grid-template-columns:1fr 1fr;gap:28px;margin:12px 0 30px}
.sh-big{position:relative;border-radius:16px;background:linear-gradient(145deg,#eef7e3,#d6ecbd);aspect-ratio:1/.85;display:grid;place-items:center;color:#162918}
.sh-big .ic{width:40%;height:auto}
.sh-pi{display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.sh-pi h2{font-size:28px;line-height:1.2}
.sh-pi h3{font-size:15px;margin-top:6px}
.sh-pi p{margin:0;color:#3a4a3b;line-height:1.5}
.sh-price strong{font-size:30px;color:#0F1A10;margin-right:10px}
.sh-price small{color:#4a5a4b}
.sh-sp{margin:0;padding-left:20px;line-height:1.7}
.sh-pi .sh-add{margin-top:8px;max-width:340px}
.sh-rh{font-size:20px!important;margin-bottom:14px}
.sh-foot{background:#0F1A10;color:#c9d8c4;padding:30px 24px;display:grid;grid-template-columns:1fr 1fr;gap:14px 24px;margin-top:24px}
.sh-foot div{display:flex;flex-direction:column;align-items:flex-start;gap:4px}
.sh-foot b{color:#91DF36;margin-bottom:4px}
.sh-foot button{background:none;border:0;padding:3px 0;font-size:14px;color:#c9d8c4;text-align:left}
.sh-foot button:hover{color:#91DF36}
.sh-foot p{grid-column:1/-1;margin:8px 0 0;font-size:12px;opacity:.75}
.sh-ov{position:absolute;inset:0;background:rgba(15,26,16,.55);opacity:0;pointer-events:none;transition:opacity .3s;z-index:20}
.sh-ov.on{opacity:1;pointer-events:auto}
.sh-dr{position:absolute;top:0;right:0;bottom:0;width:min(380px,100%);background:#fff;z-index:21;transform:translateX(105%);transition:transform .35s cubic-bezier(.2,.7,.2,1);display:flex;flex-direction:column;visibility:hidden}
.sh-dr.on{transform:none;visibility:visible}
.sh-dh{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1.5px solid #dfe6dc}
.sh-dh h2{font-size:20px}
.sh-dh button{background:none;border:0;padding:4px;display:flex}
.sh-dh .ic{width:22px;height:22px}
.sh-dl{list-style:none;margin:0;padding:8px 18px;flex:1;overflow-y:auto}
.sh-dl li{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid #e8eee5}
.sh-di{width:56px;height:56px;border-radius:10px;background:#eef7e3;color:#162918;display:grid;place-items:center;flex:none}
.sh-di .ic{width:28px;height:28px}
.sh-dl b{display:block;font-size:14px;font-weight:600;line-height:1.3}
.sh-dl li>div>span{font-size:13px;color:#4a5a4b}
.sh-q{display:flex;align-items:center;gap:6px;margin-top:6px}
.sh-q button{width:28px;height:28px;border-radius:50%;border:1.5px solid #cfd9cb;background:#fff;font-size:16px;line-height:1;padding:0}
.sh-q output{min-width:22px;text-align:center;font-weight:700}
.sh-q .sh-rm{width:auto;border:0;border-radius:0;font-size:12px;margin-left:8px;text-decoration:underline;color:#4a5a4b}
.sh-df{padding:16px 18px;border-top:1.5px solid #dfe6dc;display:flex;flex-direction:column;gap:8px;align-items:stretch}
.sh-df p{display:flex;justify-content:space-between;margin:0 0 4px;font-size:16px}
.sh-df .sh-lk{align-self:center}
.sh-dr>.sh-none{padding:24px 18px;flex:1}
.sh-toast{position:absolute;left:50%;bottom:18px;transform:translate(-50%,20px);background:#162918;color:#fff;border:1.5px solid #91DF36;border-radius:12px;padding:11px 18px;font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:30;width:max-content;max-width:calc(100% - 28px);text-align:center}
.sh-toast.on{opacity:1;transform:translate(-50%,0)}
.sh-app :focus-visible{outline:3px solid #91DF36;outline-offset:2px}
.sh-head :focus-visible{outline-color:#fff}
.sh-page{padding-bottom:32px}
.sh-ph2{font-size:30px!important;margin:6px 0 8px!important}
.sh-info{list-style:none;margin:18px 0;padding:0;display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.sh-info li{border:1.5px solid #dfe6dc;border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:8px}
.sh-info b{font-size:16px}.sh-info p{margin:0;color:#3a4a3b;font-size:14px;line-height:1.5}
.sh-info .sh-cic{width:52px;height:52px}.sh-info .sh-cic .ic{width:28px;height:28px}
.sh-row{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:8px}
.sh-add.alt{background:#fff;border:1.5px solid #162918;color:#162918}.sh-add.alt:hover{background:#162918;color:#91DF36}
.sh-row .sh-add{padding:11px 18px;font-size:14px}
.sh-h3{font-size:20px;margin:26px 0 12px!important}
.sh-faq{display:flex;flex-direction:column;gap:8px;max-width:50em}
.sh-faq details{border:1.5px solid #dfe6dc;border-radius:12px;padding:0 16px}
.sh-faq summary{cursor:pointer;font-weight:700;padding:14px 0;list-style:none;display:flex;justify-content:space-between;gap:10px}
.sh-faq summary::-webkit-details-marker{display:none}.sh-faq summary::after{content:"+";font-size:22px;line-height:1;color:#1f7a2b}
.sh-faq details[open] summary::after{content:"−"}.sh-faq p{margin:0;padding:0 0 14px;color:#3a4a3b;line-height:1.55;font-size:14.5px}
.sh-two{display:grid;grid-template-columns:1fr 1.3fr;gap:24px;margin-top:16px;align-items:start}
.sh-two.ck{grid-template-columns:1.4fr 1fr}
.sh-ci2{list-style:none;margin:0;padding:20px;background:#eef7e3;border-radius:14px;display:flex;flex-direction:column;gap:12px}
.sh-ci2 li{display:flex;flex-direction:column;gap:2px}.sh-ci2 b{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:#3f6b2a}
.sh-form{display:flex;flex-direction:column;gap:14px}
.sh-form label{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:700}
.sh-form input:not([type=radio]),.sh-form select,.sh-form textarea{font:500 15px "Exo 2",system-ui,sans-serif;border:1.5px solid #cfd9cb;border-radius:10px;padding:11px 12px;background:#fff;color:#0F1A10;width:100%;resize:vertical}
.sh-form fieldset{border:0;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.sh-form legend{font-size:13px;font-weight:700;margin-bottom:8px;padding:0}
.sh-form small{color:#4a5a4b;font-size:12.5px}
.sh-rd{flex-direction:row!important;align-items:center;gap:10px!important;font-weight:600!important;font-size:14px!important}
.sh-rd input{accent-color:#162918;width:18px;height:18px}
.sh-f2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sh-err{margin:0;color:#a4161a;font-weight:700;font-size:14px}
.sh-form .sh-add.big{max-width:340px}
.sh-form.wide{max-width:640px;margin-top:18px}
.sh-stp{list-style:none;margin:16px 0 0;padding:0;display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.sh-stp li{display:flex;gap:12px;align-items:flex-start;background:#eef7e3;border-radius:14px;padding:16px}
.sh-stp b{width:30px;height:30px;border-radius:50%;background:#162918;color:#91DF36;display:grid;place-items:center;flex:none}
.sh-stp span{font-size:13.5px;line-height:1.4;color:#3a4a3b}.sh-stp strong{display:block;color:#0F1A10;font-size:15px}
.sh-sum{background:#eef7e3;border-radius:14px;padding:20px}
.sh-sum h3{font-size:18px;margin-bottom:10px}.sh-sum ul{list-style:none;margin:0 0 10px;padding:0;display:flex;flex-direction:column;gap:8px}
.sh-sum li,.sh-sum p{display:flex;justify-content:space-between;gap:12px;font-size:14px;margin:0}
.sh-sum p{border-top:1px solid #c7dcb0;padding-top:10px;margin-top:8px}.sh-sum p.t{font-size:17px}
.sh-okb{max-width:520px;margin:30px auto;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.sh-oki{width:60px;height:60px;border-radius:50%;background:#162918;color:#91DF36;display:grid;place-items:center}.sh-oki .ic{width:32px;height:32px}
.sh-okb p{margin:0;color:#3a4a3b}
.sh-abt{display:grid;grid-template-columns:1.2fr 1fr;gap:24px;align-items:start;margin:14px 0 20px}
.sh-abt p{margin:0 0 12px;line-height:1.6;color:#2c3d2d}
.sh-abt .sh-info{grid-template-columns:1fr;margin:0}
.sh-slg{display:inline-block;background:#162918;color:#91DF36;font-weight:800;padding:8px 16px;border-radius:999px}
.sh-old{color:#6b7a6c;font-weight:500;font-size:13px;margin-right:4px}
@container (max-width:900px){.sh-nav>button,.sh-dd>button{padding:8px 7px;font-size:13px}.sh-se{flex:0 1 160px;min-width:120px}.sh-head{gap:8px;padding:12px 16px}}
@container (max-width:760px){.sh-info,.sh-stp{grid-template-columns:1fr}.sh-two,.sh-two.ck,.sh-abt{grid-template-columns:1fr}.sh-nav>button,.sh-dd>button{padding:8px 8px;font-size:13px}.sh-head{gap:8px;padding:12px 16px}}
@container (max-width:560px){.sh-f2{grid-template-columns:1fr}.sh-ph2{font-size:24px!important}}
@container (max-width:760px){
 .sh-grid{grid-template-columns:repeat(2,1fr)}
 .sh-cats{grid-template-columns:repeat(3,1fr)}
 .sh-se{width:auto;flex:1}
 .sh-pg{grid-template-columns:1fr}
}
@container (max-width:560px){
 .sh-head{flex-wrap:wrap;gap:10px 12px;padding:10px 14px}
 .sh-mb{display:flex}
 .sh-logo{margin-right:auto}
 .sh-logo img{height:30px}
 .sh-nav{display:none;order:5;width:100%;flex-direction:column;align-items:stretch;margin:0}
 .sh-nav.open{display:flex}
 .sh-nav>button,.sh-dd>button{width:100%;text-align:left}
 .sh-ddm{position:static;box-shadow:none;background:rgba(255,255,255,.08);margin:0 0 4px}
 .sh-ddm button{color:#fff}.sh-ddm button:hover{background:rgba(145,223,54,.16)}
 .sh-se{order:6;flex:1 1 100%}
 .sh-perks{grid-template-columns:1fr;padding:14px}
 .sh-sec{padding:22px 14px 4px}
 .sh-sec h2{font-size:20px}
 .sh-cats{grid-template-columns:repeat(2,1fr)}
 .sh-grid{gap:10px}
 .sh-pr{flex-direction:column;align-items:stretch;gap:8px}
 .sh-pr .sh-add{width:100%;border-radius:10px;padding:9px 8px}
 .sh-ar{display:none}
 .sh-mini{grid-template-columns:1fr}
 .sh-foot{padding:24px 14px}
 .sh-pi h2{font-size:22px}
}
@media (max-width:700px){.shop-chrome em{display:none}.sh-app{height:640px}}
@media (prefers-reduced-motion:reduce){.sh-sl,.shop-frame,.sh-dr,.sh-ov,.sh-toast{transition:none}.sh-badge i,.sh-ct.bump{animation:none}}
/* ---- Mockup do website FalconTech ---- */
.fsw .sh-badge{background:#E9ECF9;color:#1B1E25}
.fsw .sh-badge i{background:#0d1222}
.fsw .sh-dev button[aria-pressed="true"]{background:#E9ECF9;color:#1B1E25}
.fv-app{font-family:"Work Sans",system-ui,sans-serif;background:#fff;color:#1B1E25}
.fv-app :where(h1,h2,h3,p,ul,ol){margin:0}
.fv-app :where(ul,ol){padding:0;list-style:none}
.fv-app :where(button,input,textarea){font-family:inherit}
.fv-app :focus-visible{outline:3px solid #3D77C4;outline-offset:2px}
.fv-app .ic{width:24px;height:24px;flex:none}
.fv-app .ic.sm{width:16px;height:16px}.fv-app .ic.lg{width:48px;height:48px}
.fv-top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;background:#05070d;color:#c4cbe3;font-size:12px;padding:7px 28px}
.fv-tc{display:flex;gap:16px;flex-wrap:wrap}
.fv-top a,.fv-top button{color:#fff;background:none;border:0;padding:0;font:inherit;text-decoration:none;cursor:pointer}
.fv-top a:hover,.fv-top button:hover{text-decoration:underline}
.fv-head{position:sticky;top:0;z-index:6;display:flex;align-items:center;gap:14px;background:#0d1222;color:#fff;padding:10px 28px;box-shadow:0 1px 0 rgba(255,255,255,.1)}
.fv-logo{background:none;border:0;padding:0;display:flex;margin-right:10px;cursor:pointer}
.fv-logo img{height:44px;width:auto;display:block}
.fv-nav-l{display:flex;align-items:center;gap:2px;margin-right:auto}
.fv-nav-l button,.fv-dd>button{background:none;border:0;font-weight:600;font-size:14px;color:#fff;padding:9px 12px;border-radius:8px;cursor:pointer;white-space:nowrap}
.fv-nav-l button:hover,.fv-dd>button:hover{background:rgba(61,119,196,.28);color:#fff}
.fv-dd{position:relative}
.fv-ddm{display:none;position:absolute;left:0;top:100%;min-width:220px;background:#fff;border-radius:12px;padding:6px;box-shadow:0 16px 36px rgba(27,30,37,.2);z-index:7}
.fv-dd.open .fv-ddm{display:flex;flex-direction:column}
.fv-ddm button{text-align:left;width:100%;color:#0d1222!important}.fv-ddm button:hover{background:#E9ECF9!important}
.fv-ic{display:flex;gap:2px}

  var TXT = {
    pt: {
      "swifttech": {
        ctx: "A SwifTech é uma loja online em desenvolvimento do GroupTech, o grupo a que também pertence a FalconTech. Sendo uma marca nova, que nasce no digital, precisava de uma identidade própria desde o primeiro dia: um logótipo que comunicasse rapidez, precisão e tecnologia e um conjunto de regras que mantivesse a loja, as redes sociais e os documentos coerentes entre si.",
        did: "Desenvolvi a identidade gráfica completa e o manual, ainda em desenvolvimento, em cinco capítulos: logótipo, tipografia, gama cromática, aplicações gráficas e estacionário. Defini o logótipo principal, a versão sem slogan e o símbolo (uma andorinha com a asa pixelizada), a área de proteção, a dimensão mínima (69 px de altura e 204 px de comprimento), as versões positiva, negativa, escala de cinza e duas simplificadas, as regras de aplicação sobre fundos cromáticos, fotográficos e gradientes e seis utilizações indevidas. Fixei a tipografia (Exo 2 e Garet) e nove cores com equivalência em Pantone, CMYK, RGB, HEX e RAL, e criei os wallpapers e o modelo de assinatura de email. Em paralelo, estou a desenvolver o website da loja em Shopify e a planear o projeto e as tarefas no Asana.",
        out: "Projeto em desenvolvimento desde 2026. O manual ainda está em desenvolvimento e já cobre logótipo, tipografia, cor, wallpapers e assinatura de email; as redes sociais e a newsletter estão em revisão e o cartão de visita, os templates de documentação, os envelopes e os dossiês estão por fazer. O website em Shopify está em desenvolvimento.",
        facts: [["5", "capítulos do manual"], ["9", "cores com códigos Pantone, CMYK, RGB, HEX e RAL"], ["2", "famílias tipográficas: Exo 2 e Garet"], ["2026", "início do projeto, em desenvolvimento"]],
        m: ["Este mockup interativo é apenas um exemplo, ainda em desenvolvimento, de como poderá ficar a loja online da SwifTech, de videovigilância, videoporteiros, alarmes, domótica e controlos de acesso. Parte da estrutura da LojaTech e aplica a identidade da SwifTech. Os produtos, preços e textos são ilustrativos. É possível navegar, pesquisar, filtrar por categoria, abrir um produto, adicionar ao carrinho e passar pelas restantes páginas (apoio técnico, contactos, reparações, outlet, sobre nós e finalizar compra); não há pagamento.",
            "O logótipo junta o símbolo, uma andorinha (swift) com a asa pixelizada que une o mundo natural à estética digital, ao lettering SwifTech e ao slogan «Click & Done». A versão principal serve os pontos de contacto, o digital, o comercial e o editorial e não deve ser reconstituída a partir de elementos separados. A versão sem slogan e o símbolo isolado são alternativas simplificadas, a usar com critério.",
            "Sobre fundos cromáticos, o logótipo aplica-se diretamente desde que haja contraste (testei doze fundos). Sobre fotografia dispensa caixa de isolamento e, sem contraste, clareia-se ou escurece-se a área de aplicação. Sobre gradientes, ajusta-se a orientação, a intensidade ou o tom se a leitura ficar comprometida.",
            "Além da versão a cores, há a versão positiva (a preto, para fundos claros), a negativa (a branco, para fundos escuros) e a escala de cinza, só quando a cor não é tecnicamente viável. Existem ainda duas versões simplificadas, de uma só cor: a verde principal, para fundos no tom secundário mais escuro, e a verde secundária, para fundos no tom principal.",
            "Seis erros a evitar, de A a F: deformação de proporções, alteração de elementos, alteração de tipografia, alteração de alinhamentos, sombras ou efeitos não conformes e aplicação sobre fundo sem contraste suficiente.",
            "A área de proteção é definida pela medida X e deve ficar livre de elementos gráficos, texto ou fundos. A dimensão mínima é de 69 px de altura e 204 px de comprimento; em baixa resolução, o logótipo deve ser aumentado proporcionalmente.",
            "Os wallpapers seguem os modelos do manual e estão organizados em pastas por formato: desktop, mobile e tablet.",
            "O modelo de assinatura de email é simples e coerente com a identidade: mensagem de agradecimento, nome e cargo ou equipa, email institucional, contacto telefónico direto, telefone geral e website.",
            "Nove cores, cada uma com equivalência em Pantone, CMYK, RGB, HEX e RAL: as três institucionais (verde-lima, verde-escuro e quase preto), três variações para contextos específicos e uma escala de neutros, de branco a preto, de apoio à composição. Os valores são vinculativos, em qualquer meio.",
            "A Exo 2 é a fonte institucional, para títulos e texto corrido em todos os suportes, digitais, impressos, institucionais e comerciais. Tem nove pesos, de Fino a Black.",
            "A Garet é a fonte secundária, em cinco pesos (de Light a Black). Entra quando a institucional não está disponível, como em documentos partilhados ou plataformas com limitações técnicas, para manter a legibilidade e a coerência da comunicação.",
            "Em revisão: modelos de redes sociais e newsletter. Por fazer: cartão de visita, templates de documentação, envelopes e dossiês."] },
      "arfit": {
        ctx: "Em junho de 2024 entrei na Arfit Climatização, empresa de equipamentos de climatização (AVAC), como Técnico de Multimédia, no departamento de marketing coordenado por Teresa Teixeira. A missão era gerir e fazer evoluir a comunicação visual da marca, de forma consistente em todos os pontos de contacto: do catálogo ao email, do software às redes sociais, da fábrica aos eventos.",
        did: "Fui responsável pela comunicação visual da marca, dentro e fora de portas. Na comunicação comercial desenvolvi o Catálogo Técnico 2025, um dos maiores projetos, a Tabela de Preços 2025, flyers, anúncios em revistas, as capas e o rodapé das propostas e documentos em PHC, assinaturas de email animadas e newsletters. Nas redes sociais produzi publicações e reels para o Instagram e colaborei e supervisionei, em conjunto com a equipa, a campanha de lançamento da solução «Be On. Be Smart.». Criei a identidade e a interface (UI) do software interno «ArfitSelect», onde se selecionava o produto pretendido e se consultavam os seus dados, com foco em UX e alinhada com a marca. Dei também apoio gráfico à produção e aos eventos: etiquetas de produto, desenhos técnicos para o departamento de produção, um filme personalizado para envolver máquinas, credenciais do Open Day, crachás de colaboradores e materiais de Natal e de Páscoa. Trabalhei com as equipas técnica e comercial no apoio às estratégias de marketing e de vendas. Geri ainda o website da Arfit em backoffice, onde fazia o upload de toda a documentação (catálogos, tabelas de preços e restante documentação técnica e comercial), mantendo-a atualizada para clientes e parceiros.",
        out: "O trabalho contribuiu para uma comunicação mais consistente da marca, para um aumento de 35% do engagement digital e para o reforço do apoio comercial através de materiais estratégicos. Na carta de recomendação, a responsável de marketing aponta a campanha «Be On. Be Smart.» como representativa da minha capacidade de execução, do meu pensamento visual e da minha atenção ao posicionamento da marca.",
        facts: [["+35%", "engagement digital"], ["12", "meses, de junho de 2024 a junho de 2025"]],
        m: [
            "Desenvolvi publicações para o Instagram da Arfit sobre o mesmo sistema gráfico da marca: formas diagonais em azul e verde, a faixa «PORTUGAL | arfit.pt» e o logótipo no rodapé, o que torna cada publicação reconhecível à primeira vista. Dentro dele há várias linhas de conteúdo: novos produtos e novidades de gama (como a unidade de baixo perfil e o comando digital CM3D), parcerias (Elektrovent), reconhecimentos como o Selo ID, datas comemorativas e mensagens sazonais (25 de Abril, Páscoa, S. Valentim, Boas Festas) e a campanha «Be On. Be Smart.», com uma linguagem visual própria, mais tecnológica. A montagem reúne uma seleção; a comunicação inclui ainda rubricas como «Dica Arfit», «Curiosidade Arfit» e «Projetos que falam por nós», as «Soluções SACE Arfit» e a divulgação de eventos, seminários e formações internas.",
            "Os reels seguem a mesma linguagem das publicações. Cada capa identifica o tema com um título grande sobre fotografia ou fundo gráfico, as formas diagonais e a faixa «PORTUGAL | arfit.pt». Os seis reels apresentados cobrem a solução «Be On. Be Smart.», o aniversário da Arfit, o Jantar de Natal, o Open Day, uma máquina da fábrica («A inovação é o caminho para o futuro») e a formação interna. Clica no botão de play de cada capa para ver o reel no Instagram.",
            "O «ArfitSelect» era um software interno da Arfit onde se fazia a seleção da especificação de cada produto pretendido e se apresentavam todos os dados do mesmo. Desenvolvi o logótipo, que junta um documento e uma folha de cálculo ao nome ArfitSelect, na paleta de azul e verde da marca, com a assinatura «by arfit».",
            "Desenvolvi as páginas da interface do software «ArfitSelect», no mesmo gradiente de azul e verde do logótipo. A página inicial oferece a pesquisa por nome e duas formas de começar: seleção direta e seleção guiada. Há ainda o login, o registo, a recuperação de password, a gestão de projetos (lista de simulações, com as datas de última modificação e de criação, e as ações ver, eliminar e mover de localização), os detalhes de projeto e de utilizador e um menu lateral com a gestão de projetos, de conta e de administração (utilizadores, gamas, modelos, acessórios e filtros). A interface está disponível em português, espanhol, inglês e francês. Aqui mostro uma montagem das páginas. Preparei também o mapa do site, um documento de 13 páginas que organiza o software em áreas (página inicial, área reservada para utilizadores externos e internos/administradores, e área de seleções, direta e guiada) e explica, página a página, o que cada uma faz: as ações disponíveis, os avisos de confirmação ao apagar ou guardar e o percurso entre páginas, assinalando as que já estavam criadas e as que faltava criar.",
            "Folha de seleção em PDF que se podia descarregar do produto, aqui exemplificada com o Plug EC. Tem seis páginas: a capa e cinco páginas de conteúdo. A página 1 reúne a descrição, as normas e certificações, as vantagens, os acessórios e os componentes (motor, ventilador e filtros). A 2 mostra o ponto de funcionamento, a curva de desempenho e os dados de funcionamento; a 3, os dados acústicos, as características técnicas, o código de artigo e as dimensões; a 4, o esquema elétrico; e a 5, a ficha ERP. Todas as páginas têm um cabeçalho com a data, o produto, a gama, a subgama, a referência da unidade e o projeto, e um rodapé com os contactos, o utilizador e a versão. Defini também as normas gráficas da folha, para uniformizar os PDF: tipo de letra Klavika, paleta de azul e verde da marca, margens de 1,3 cm e logótipo com 7 × 1,4 cm.",
            "Assinaturas de email animadas (GIF) para a comunicação da Arfit, desenvolvidas para as comunicações da marca, incluindo a solução «Be On. Be Smart.».",
            "Três newsletters da Arfit. A primeira apresenta o novo produto «Be On. Be Smart.»: o módulo Be On liga os equipamentos à plataforma Be Smart, permitindo a monitorização remota em tempo real do desempenho e da manutenção, com alertas automáticos. A segunda divulga o Open Day de 4 de junho de 2025, na sede da Arfit, das 10h45 às 13h30 e seguido de almoço, com a visita à produção das unidades PURE e uma demonstração das soluções SACE, com inscrições abertas até 29 de maio. A terceira é a newsletter de Natal, com o convite para o Jantar de Natal: confirmação de presença até 6 de dezembro e encontro a 13 de dezembro de 2024, às 19h, na Quinta Geraldino, na Maia. Tratei do design e da composição de todas, a partir de imagens do produto e das instalações e, no caso da de Natal, de uma ilustração na paleta de cores da marca com o símbolo da Arfit numa bola de Natal.",
            "Mockup do flyer A5 da solução «Be On. Be Smart.», de monitorização remota de equipamentos.",
            "Mockup de um flyer de recrutamento da Arfit (dobrável, exterior e interior), que apresenta a empresa, a estrutura da equipa e os incentivos para novos colaboradores.",
            "Mockup do flyer dobrável sobre Automação em Edifícios e as Soluções SACE, com a identidade «Solução Arfit», exterior e interior.",
            "O Catálogo Técnico 2025 foi um dos maiores projetos que desenvolvi na Arfit, semelhante à tabela de preços, mas bastante mais complexo. Cada produto tem uma página própria, com descrição, normas e certificações (como TÜV Nord e Eurovent), vantagens, componentes, acessórios e tabelas de características técnicas com notas. Tratei da estrutura e da paginação, da hierarquia da informação e da identidade visual de cada família de produto, como o Tratamento de Ar e as Unidades de Condensação, e produzi o catálogo nas quatro línguas: português, espanhol, francês e inglês.",
            "Desenvolvimento e atualização da Tabela de Preços 2025 da Arfit, disponível em quatro línguas (português, espanhol, francês e inglês): um catálogo de preços organizado por famílias de produto, como a Ventilação e a Recuperação, com tabelas por modelo, referência e preço, e linhas dedicadas aos acessórios. A nova edição foi divulgada nas assinaturas de email com a indicação de que as atualizações estão disponíveis em arfit.pt.",
            "Anúncios desenvolvidos para revistas do setor, onde a Arfit fazia a publicidade dos seus produtos: um para a «Edifícios e Energia», em formato vertical, e outro para «O Instalador», em formato horizontal. Ambos divulgam o Be Smart, com a mensagem «A nova era da monitorização começa hoje!»: todos os equipamentos Arfit com ligação direta à nuvem, menos deslocações, mais controlo e dados em tempo real, com remissão para arfit.pt e um código QR. Adaptei a mesma identidade visual, com o logótipo Be.Smart e os circuitos, aos dois formatos. Desenvolvi ainda um anúncio para a revista PICLIMA, em formato vertical, com a mensagem «Parabéns, PICLIMA! 20 anos de compromisso com o setor HVAC», sob o lema «Esteja dois passos à frente: Be On. Be Smart.».",
            "Desenvolvi as credenciais de identificação dos convidados nos eventos Open Day da Arfit. Cada credencial inclui uma fotografia da produção, o título «Open Day», o nome do convidado, a empresa, a data do evento (nos exemplares mostrados, 19 de fevereiro de 2025) e o endereço arfit.pt com as redes sociais. As folhas reúnem várias credenciais, uma por convidado, e aqui mostro dois exemplares. Desfoquei os nomes e as empresas para proteger a identidade dos convidados.",
            "Desenvolvi os crachás para identificação de cada colaborador da Arfit. Cada crachá tem o símbolo da marca e o nome do colaborador em duas linhas, em branco sobre um fundo azul ondulado, com o símbolo em verde da paleta da marca. O mockup mostra uma seleção de crachás. Desfoquei os nomes para proteger a identidade dos colaboradores.",
            "Desenvolvi o padrão de um filme personalizado para envolver as máquinas que a arfit fornece ou desenvolve. O filme repete o logótipo da marca na diagonal, em azul sobre fundo branco, e preparei duas escalas do mesmo padrão: uma com o logótipo mais pequeno e repetido, outra com o logótipo maior. O mockup simula o filme aplicado a duas unidades e em rolo.",
            "Desenvolvi as capas das propostas comerciais produzidas no PHC, a plataforma que a equipa usava para preparar propostas para os clientes. Criei versões para áreas diferentes: Suporte (contratos de manutenção, supervisão remota e extensão de garantia, sob o mote Desempenho Superior), arfit by Elektrovent (gama de ventilação), uma versão export em inglês dedicada à unidade de tratamento de ar higiénica PURE e outra para os sistemas de automatização e controlo de edifícios (Soluções SACE). Mantêm a mesma estrutura gráfica, o que dá coerência às propostas, e cada capa adapta imagem e mensagem ao produto.",
            "Desenvolvi também o rodapé dos documentos emitidos a partir do PHC. Reúne os selos de certificação (TÜV Rheinland ISO 9001:2015, Serviço Certificado e PME Líder 2024), a identificação da empresa (Arfit Climatização S.A., NIF 500 110 409) e as marcas que representa: BlueBox by Swegon, FAST, arfit, Galletti e Bosch.",
            "Desenvolvi etiquetas para colocar nos produtos da arfit, com as indicações IN e OUT. Cada uma tem um círculo exterior, uma seta a apontar para dentro ou para fora de um círculo e a assinatura «by arfit®». O desenho é feito apenas com contornos a preto sobre branco.",
            "Desenvolvi desenhos técnicos explicativos para o departamento de produção, um para cada produto indicado no nome do ficheiro: PLUG EC 315, PLUG EC 190 / 220 / 250 e PLUG EC 315 II / 350 / 400 / 500 / 560. Cada desenho mostra a régua de terminais com as respetivas indicações (como 24V, 10V, GND, entradas, relé K1 e a alimentação L1, L2, L3/N e PE), a numeração de cada ligação e a ligação da alimentação através do interruptor. A disposição dos terminais muda de produto para produto e cada desenho segue a sua. Fiz ainda um desenho com as dimensões de uma unidade, com as cotas D, E e F e as setas de entrada e saída de ar, e o esquema de ligação High EF Plus, em português, que liga a unidade exterior High EF, a Control Box e a UTA através de ligações elétricas, tubagem de líquido e tubagem de gás. O esquema indica o cabo Olflex 3 x 1,5 mm² e as ligações já efetuadas em fábrica.",
            "Itens desenvolvidos para o Natal da Arfit de 2024: o postal de Natal, com a mensagem «A Arfit deseja-lhe Festas Felizes! Contamos com a sua companhia em 2025», e as etiquetas A6 «Para aquecer os dias frios… usa sem moderação!», ambos com o símbolo da Arfit numa bola de Natal, no azul e no verde da marca.",
            "Menu do Jantar de Natal de 13 de dezembro de 2024, com frente e verso: entrada de creme aveludado de legumes, prato principal de lombinhos de porco Wellington com arroz, pêra bêbada e juliana de legumes, buffet de sobremesas e café. Foi impresso em folhas A4 com cinco menus lado a lado.",
            "Natal Solidário: cartaz A4 da recolha de donativos, com o logótipo da Cruz Vermelha Portuguesa, na mesma identidade natalícia.",
            "O rollup e a bandeira em forma de gota, também desenvolvidos para o Natal da Arfit, com o logótipo e o lema «your complete solutions» sobre o fundo azul da marca. Os mockups mostram como ficam em exposição.",
            "Criei a etiqueta de Páscoa que acompanhava o presente oferecido aos colaboradores. Mantive as cores da marca e juntei o logótipo a um ovo com orelhas de coelho, sobre um fundo com padrão de motivos pascais e uma faixa de relva, com a mensagem \"Feliz Páscoa!\" em destaque."
          ] },
      "lojatech": {
        ctx: "A LojaTech foi um projeto de loja online do GroupTech, o grupo a que também pertencem a FalconTech e a SwifTech. Como marca nova, precisava de uma identidade própria desde o primeiro dia, com um ar tecnológico e reconhecível.",
        did: "Em 2025 desenvolvi apenas o branding: o manual de identidade gráfica, em cinco capítulos (logótipo, tipografia, gama cromática, aplicações gráficas e estacionário). Defini o logótipo principal, com e sem slogan, e o símbolo; as regras de aplicação (área de proteção, dimensão mínima, versões cromáticas, fundos e erros a evitar); as famílias tipográficas Neotech e Poppins; a gama cromática, em vermelho, preto e branco; e as aplicações gráficas: wallpapers, templates para redes sociais, assinatura de email e template do website.",
        out: "Devido a um conflito de direitos de domínio, a marca não seguiu com este nome e foi refeita como SwifTech. A LojaTech ficou assim só na fase de branding: o manual cobre o logótipo, a tipografia, a cor, os wallpapers, as redes sociais, a assinatura de email e o template do website; as newsletters e o estacionário ficaram por fazer.",
        facts: [["5", "capítulos do manual"], ["6", "cores com valores CMYK, RGB, HEX e RAL"], ["2", "famílias tipográficas: Neotech e Poppins"], ["2025", "ano do projeto, só branding"]],
        m: ["O logótipo junta um símbolo, um edifício ligado a um circuito, ao lettering LOJATECH, em branco e vermelho, com um ícone de ligação sem fios no «O», e ao slogan «Inova hoje... simplifica amanhã!». A versão principal, horizontal e sem slogan, é a escolha recomendada sempre que possível. A versão com slogan é a expressão mais completa da marca e a simplificada, só com o símbolo, é um recurso para formatos pequenos, monogramas ou fundos muito complexos, a usar com moderação.",
            "A área de proteção é definida pela medida X e deve ficar livre de elementos gráficos, texto ou fundos. A dimensão mínima é de 50 px de altura e 325,2 px de comprimento na versão sem slogan, e de 85 px de altura e 430,4 px de comprimento na versão com slogan; em baixa resolução, o logótipo deve ser aumentado proporcionalmente.",
            "Além da versão a cores, há a versão positiva (a preto, para fundos claros), a negativa (a branco, para fundos escuros) e a escala de cinza, só quando a cor não é tecnicamente viável. Existem ainda variações específicas para fundos de cor.",
            "Sobre fundos cromáticos, o logótipo aplica-se diretamente desde que haja contraste (mostro doze fundos). Sobre fotografia dispensa caixa de isolamento e, sem contraste, clareia-se ou escurece-se a área de aplicação. Sobre gradientes, ajusta-se a orientação, a intensidade ou o tom se a leitura ficar comprometida.",
            "Seis erros a evitar, de A a F: deformação de proporções, alteração de elementos, alteração de tipografia, alteração de alinhamentos, sombras ou efeitos não conformes e aplicação sobre fundo sem contraste suficiente.",
            "A Neotech é a fonte institucional, para títulos e texto corrido em todos os suportes, digitais, impressos, institucionais e comerciais. Tem três pesos: Light, Normal e Bold.",
            "A Poppins é a fonte secundária, em cinco pesos (de Light a Black). Entra quando a institucional não está disponível, como em documentos partilhados ou plataformas com restrições técnicas, para manter a legibilidade e a coerência da comunicação.",
            "Seis cores, com os valores em CMYK, RGB, HEX e RAL (e Pantone, quando aplicável): as três institucionais (vermelho #FF2C2C, quase preto #1A1A1A e branco) e três variações para contextos específicos (um vermelho mais escuro, #E60000, um cinza-escuro, #262626, e um cinza claro, #F2F2F2).",
            "Os wallpapers seguem o template do manual e estão organizados em pastas por formato: desktop, mobile e tablet.",
            "As publicações para redes sociais podem desdobrar-se em rubricas de conteúdo, como fotos, produtos e informação, e devem respeitar na íntegra o template fornecido. Para dar diversidade visual, desenvolvi também templates com as cores invertidas.",
            "O modelo de assinatura de email é simples e coerente com a identidade: mensagem de agradecimento, título (Equipa de Apoio ao Cliente), email institucional, contacto telefónico, website e a imagem institucional. Deve ser exclusivamente em texto, com a imagem complementar disponível para quem quiser copiar a informação com facilidade.",
            "Template da página inicial do website, com a mensagem «Torna a tua casa mais segura e inteligente» e os ícones das categorias de produtos, sobre fundo escuro e com a identidade vermelha da marca. Aqui mostro o mockup.",
            "Ficaram por fazer as newsletters e o estacionário: cartão de visita, templates de documentação, envelopes, dossiers e vestuário. A marca foi entretanto refeita como SwifTech."] },
      "falcontech": {
        ctx: "A FalconTech é uma empresa de segurança e tecnologia de Vila Nova de Gaia, com serviços de domótica, videovigilância, automação, alarmes e deteção de intrusão e monitorização. Faz parte do GroupTech, grupo a que também pertence a SwifTech, loja online em desenvolvimento. Em junho de 2025 entrei como Responsável de Marketing para criar o departamento de raiz, definindo processos, ferramentas e estratégia.",
        did: "Defini a estratégia de marketing e de branding e estruturei o departamento, com os processos e as ferramentas de trabalho. Planeio e executo o marketing digital e a comunicação offline, e giro os projetos internos em coordenação com as equipas técnicas e comerciais. Implementei o CRM (HubSpot) e a gestão de tarefas em Asana e Trello, para dar eficiência operacional e acompanhamento comercial, e, como a FalconTech é uma startup em crescimento, faço também o recrutamento e seleção: defino o perfil das vagas, divulgo as oportunidades, faço a triagem das candidaturas e as entrevistas, escolho os candidatos e acompanho a integração, incluindo os estágios. Criei a identidade visual e as brand guidelines que uniformizam a comunicação interna e externa. O manual de identidade gráfica é o exemplo mais completo desse trabalho: cinco capítulos (logótipo, tipografia, gama cromática, aplicações gráficas e estacionário), com o logótipo principal, o logo simplificado e o símbolo, quatro versões cromáticas, a área de proteção, a dimensão mínima (80 px de altura sem slogan e 150 px com slogan), as regras de aplicação sobre fundos e seis utilizações indevidas. Fixei a tipografia (Work Sans e Montserrat) e seis cores com equivalência em Pantone, CMYK, RGB, HEX e RAL, e apliquei o sistema em wallpapers, redes sociais, assinatura de email, newsletter, cartão de visita, documentação, placas de dissuasão e vestuário.",
        out: "Contributo para um aumento de 40% da notoriedade digital e de 30% de leads qualificadas. A marca passou também a ter um documento único de referência, com medidas, códigos de cor e exemplos de erros, que já cobre oito tipos de aplicação.",
        facts: [["5", "capítulos do manual"], ["6", "cores com códigos Pantone, CMYK, RGB, HEX e RAL"], ["2", "famílias tipográficas: Work Sans e Montserrat"], ["8", "tipos de aplicação já criados"]],
        m: [
            "Proposta de redesign do website falcontech.pt, apenas um mockup interativo de exemplo, sem ligação ao site oficial. Parti do site atual e mantive a sua mensagem e as suas secções (o título «Evitar o assalto e não apenas fazer o registo», os serviços, o registo PSP-SIGESP, «Peça já o seu orçamento», «Porque trabalhar com a FalconTech» e «Dê uma nova vida à sua casa»). O que melhorei: o título passou a ter uma descrição clara, o GIF em ciclo deu lugar a exemplos interativos (câmara, alarme e portão; casa com luz, estores e modo «saída de casa»), o pedido de orçamento e de avaria fazem-se em três passos, as secções que estavam só com títulos ganharam conteúdo, o português foi corrigido e o link solto e as etiquetas repetidas foram removidos. Usei apenas informação do site atual (serviços, contactos e registo) e as cores e o logótipo do manual. Os textos novos são sugestões. Podes alternar entre habitação e empresas, abrir cada serviço, pedir um orçamento de exemplo e ver a versão para telemóvel.",
            "Selecionei as publicações de 2026 que considero visualmente mais fortes e juntei-as num mockup. A página passou a ter rubricas com linguagem própria, como a Falcon Solutions (equipamentos Hikvision), a Falcon Gear (equipamentos de segurança), a Falcon Secret Tips (dicas) e as datas comemorativas (Dia do Sorriso, Dia Mundial do Pânico, Dia da Bondade). Têm em comum o azul da marca ou o fundo branco, a tipografia grande, o produto ou a pessoa em destaque e o website e o logótipo no rodapé.",
            "Reels de 2026 em três séries de vídeo, com capas numeradas por episódio e uma estrutura gráfica própria para cada série: Comercial, Instalações e Setup. Mostram o trabalho no terreno (os bastidores de duas instalações no mesmo dia e uma visita surpresa a uma obra), um portão que abre sozinho com câmara LPR e controlo de acessos por RFID, o terminal de controlo de acessos Akuvox, a preparação de uma câmara Hikvision antes de chegar ao cliente e uma resposta à pergunta «que tecnologia devia ter em sua casa?». Ao clicar no botão de play de cada capa, abre o reel no Instagram.",
            "Entre janeiro e outubro de 2026, as redes sociais da FalconTech cresceram em todas as plataformas: os seguidores aumentaram 53,7% no Instagram (de 1.264 para 1.943), 57,0% no Facebook (de 1.179 para 1.851) e 170,6% no LinkedIn (de 279 para 755).\nEm outubro, o LinkedIn teve o melhor mês do canal, com 946 cliques, 6.975 visualizações e 42 comentários, e o Facebook somou 1.797 cliques.\nNas campanhas pagas no Meta, os anúncios geraram 2.595 leads no mesmo período, com melhoria ao longo de outubro e a melhor semana do mês nos últimos dias (84 leads).\nO acompanhamento mensal e semanal, por rede e por campanha, define as prioridades do mês seguinte.",
            "Templates de publicações e stories em três categorias de conteúdo (fotos, produtos e informações), cada um com uma versão de cores invertidas, para dar variedade visual sem sair da identidade.",
            "Newsletter sobre videovigilância com inteligência artificial: cabeçalho com o símbolo, banner, texto de apresentação, bloco com chamada para ação («Pedir o meu orçamento») e rodapé com morada, contactos e redes sociais.",
            "Modelo apenas em texto, para que o destinatário possa copiar a informação, composto por mensagem de agradecimento, nome e cargo, email institucional, telefone, morada, website e uma imagem institucional complementar.",
            "Modelos de wallpaper para desktop, mobile e tablet, guardados em pastas separadas por dispositivo.",
            "Polo preto com gola e punhos em azul, com o logótipo e a identificação «Assistência técnica» no peito e nas costas, desenvolvido para identificar os instaladores nas intervenções no terreno.",
            "Cartão de duas faces: a frente, escura, tem o logótipo, os serviços (domótica, videovigilância, automação, alarmes e deteção de intrusão, monitorização) e as redes sociais; o verso, claro, reúne os dados de contacto. Os dados do exemplo são fictícios.",
            "Duas versões com o mesmo modelo gráfico: uma indica que o local é objeto de videovigilância e a outra que o sistema de alarme está ativo. Ambas levam o telefone e o website.",
            "Capa e contracapa para documentos comerciais, sobre fundo escuro com a malha de pontos e linhas da marca. A capa leva o título e o símbolo; a contracapa, o logótipo completo, o website e as redes sociais.",
            "O logótipo combina o símbolo e o lettering FALCONTECH. O logo principal inclui o slogan «Segurança & Tecnologia», existe apenas nesta configuração e não deve ser reconstituído a partir de elementos separados. O logo simplificado, sem slogan, e o símbolo isolado são alternativas de recurso, reservadas a formatos pequenos, áreas técnicas restritas ou fundos visualmente complexos.",
            "Sobre fundos cromáticos, o logótipo pode ser aplicado diretamente desde que haja contraste (testei doze cores). Sobre fotografia, não se usa caixa de isolamento e, quando nenhuma versão tem contraste, clareia-se ou escurece-se a área da imagem. Sobre gradientes, ajusta-se a orientação, a intensidade ou a tonalidade se a leitura ficar comprometida.",
            "Além da versão a cores, para fundos claros e escuros, existem a versão positiva (a preto, só para fundos claros), a negativa (a branco, só para fundos escuros) e a escala de cinza, usada apenas quando a cor não é tecnicamente possível e sempre a partir dos ficheiros oficiais.",
            "A área de proteção é definida pela medida X e deve ficar livre de qualquer elemento gráfico, texto ou fundo. A dimensão mínima é de 80 px de altura (171,1 px de comprimento) sem slogan e de 150 px de altura (294,4 px de comprimento) com slogan.",
            "Seis erros a evitar, identificados de A a F: deformação de proporções, alteração de elementos, alteração de tipografia, alteração de alinhamentos, aplicação de sombras e efeitos e aplicação sobre fundo sem contraste.",
            "A Work Sans é a fonte institucional, em cinco pesos (Light, Regular, Medium, Bold e Black), para títulos e texto corrido, em suportes digitais e impressos. A Montserrat (Light, Normal e Bold) é a fonte secundária, para contextos em que não é viável usar a institucional, como documentos partilhados.",
            "Três cores institucionais: azul #253D97 (Pantone 7686 C), preto-azulado #1B1E25 (Pantone 6 C) e azul muito claro #E9ECF9 (Pantone 656 C). Três variações: azul #3D77C4 (Pantone 2171 C), cinza escuro #323439 (Pantone 432 C) e branco. Cada cor tem equivalência em Pantone, CMYK, RGB, HEX e RAL, e não são permitidas outras tonalidades."] },
      "special-casa": {
        ctx: "A Special Casa é uma imobiliária e precisava de uma presença consistente nas redes sociais, capaz de gerar interação orgânica com quem procura, compra ou vende casa.",
        did: "Defini uma linha visual única para toda a comunicação e desenhei as publicações em Illustrator e Photoshop, organizadas em quatro tipos de conteúdo: dicas para quem compra ou vende, anúncios de imóveis, recrutamento de consultores e datas sazonais, como o São João. Planeei e agendei tudo no Meta Business Suite e analisei o desempenho de cada publicação para otimizar os conteúdos seguintes.",
        out: "A Special Casa passou a comunicar com uma identidade reconhecível e a interação orgânica passou a ser medida publicação a publicação, base para decidir que formatos repetir.",
        facts: [["4", "tipos de conteúdo"], ["2023/24", "período"], ["3", "ferramentas: Illustrator, Photoshop e Meta Business Suite"]],
        m: ["Publicações para as redes sociais com quatro objetivos: educar (dicas para comprar ou vender casa), vender (anúncios de imóveis), recrutar (consultores) e criar proximidade (comunicação sazonal, como o São João). Cada tipo tem a sua estrutura gráfica, para que o público reconheça a marca antes de ler o texto.",
            "Objetivo: manter regularidade e perceber o que funciona.\nAção: planeei o calendário de publicações e agendei-as no Meta Business Suite, onde acompanhei os resultados de cada uma.\nResultado: um ritmo de publicação estável e decisões de conteúdo apoiadas em dados."] },
      "btbc": {
        ctx: "A BTBC (be true, be creative) presta serviços de gestão de redes sociais, design gráfico e branding. Precisava de uma identidade própria que traduzisse união e criatividade e que funcionasse do logótipo às redes sociais.",
        did: "Criei um cérebro estilizado como símbolo, defini quatro cores com significado e duas tipografias, e testei o logótipo a preto e branco para garantir leitura em qualquer fundo. Depois apliquei o sistema em logótipo, newsletter, publicações, stories, campanhas, flyers e cartão de visita, sempre em Illustrator e Photoshop.",
        out: "Um sistema de identidade completo e aplicado de forma coerente em cinco tipos de peça: logótipo, newsletter, redes sociais, flyers e cartão de visita.",
        facts: [["4", "cores com significado"], ["2", "tipografias"], ["5", "tipos de peça aplicados"], ["2023/24", "período"]],
        m: ["O símbolo é um cérebro estilizado: funciona como tela, as pessoas representam a colaboração e a sobreposição de formas traduz os caminhos da criatividade. Quatro cores (paixão, energia, confiança e criatividade) e duas tipografias, Nugo Sans Light, leve e clara, e Salma Pro, imponente e simples, fecham o sistema. O teste a preto e branco garante que o logótipo se lê em qualquer fundo.",
            "Newsletter que apresenta os serviços de gestão de redes sociais da BTBC, na mesma linguagem visual da marca, para que o email e as redes sociais comuniquem como uma só marca.",
            "Objetivo: dar à BTBC uma voz visual própria nas redes sociais.\nAção: criei publicações, stories e campanhas alinhados com o conceito de criatividade e união, com cores escolhidas para provocar emoção, e apliquei a identidade de forma coesa com as ferramentas da Adobe.\nResultado: uma presença nas redes com a mesma identidade em todos os formatos.",
            "Séries de publicações que apresentam, uma a uma, as áreas da BTBC: gestão de redes sociais, design gráfico e branding. O mesmo layout repetido cria reconhecimento e facilita a leitura em sequência.",
            "O cartão de visita resume a marca em três palavras, marketing digital, design gráfico e branding, e reúne o contacto e as redes da BTBC."] },
      "spr-auto": {
        ctx: "Entre abril de 2022 e abril de 2023 fui técnico de marketing na SPR Auto, empresa de acessórios e produtos para automóvel com loja física e loja online. O objetivo era aumentar a interação orgânica nas redes sociais e levar mais clientes ao site.",
        did: "Geri a presença da marca no Facebook, Instagram e LinkedIn: conteúdos visuais, stories e reels, fotografia e edição de imagem e vídeo (Illustrator, Photoshop, After Effects e Premiere). Planeei e executei sete campanhas promocionais, cada uma com um mecanismo diferente (recorrência, cupões, combinação de produtos, teaser, venda flash e desbloqueio diário), e monitorizei o desempenho no Meta Business Suite e no Google Analytics para ajustar as ações seguintes.",
        out: "O número de seguidores nas redes sociais aumentou 35% durante o período. Cada campanha aproveitou o que a anterior tinha mostrado: o teste de Halloween, o teaser de Inverno que preparou o Natal e os teasers que antecederam o Carnaval.",
        facts: [["+35%", "seguidores nas redes sociais"], ["7", "campanhas promocionais"], ["3", "redes sociais geridas"], ["12 meses", "abr. 2022 a abr. 2023"]],
        m: ["Objetivo: criar um hábito de compra regular.\nAção: lancei uma campanha quinzenal, a cada 15 dias, com uma seleção rotativa de produtos exclusivos online, para dar ao cliente um motivo recorrente para voltar ao site.\nResultado: mais clientes assíduos e maior visibilidade do site e das redes sociais, cumprindo o objetivo definido.",
            "Objetivo: atrair novos clientes exclusivamente para o site.\nAção: planeei uma campanha de Halloween com cupões online, válidos apenas online entre 31 de outubro e 1 de novembro de 2022, executada como teste.\nResultado: adesão moderada e mais tráfego no site, o que permitiu testar o formato antes das campanhas seguintes.",
            "Objetivo: chegar a mais clientes.\nAção: depois de analisar o mercado, juntei produtos muito procurados com artigos de menor procura na mesma campanha.\nResultado: subiram as vendas dos artigos de menor procura, que era o objetivo desta combinação.",
            "Objetivo: criar impacto imediato e expectativa.\nAção: uma promoção exclusiva de um dia, desenhada como teaser das ações seguintes.\nResultado: captou a atenção do público e criou interesse para as campanhas que se seguiram.",
            "Objetivo: converter a expectativa criada pelo teaser.\nAção: alarguei a seleção de produtos com descontos atrativos, apoiando-me no teaser lançado antes.\nResultado: as vendas subiram de forma acentuada, aproveitando o impulso da campanha anterior.",
            "Objetivo: gerar procura concentrada num só dia.\nAção: formato flash de 24 horas, antecedido por uma série de teasers nas semanas anteriores.\nResultado: subida da procura e das vendas online, resultado da antecipação criada antes do dia da campanha.",
            "Objetivo: celebrar o aniversário da marca e atrair clientes online e à loja.\nAção: durante uma semana, cada dia desbloqueava uma seleção de produtos; no dia de aniversário ficaram todos disponíveis, com celebração na loja física.\nResultado: procura elevada, tanto online como na loja.",
            "Banners para o site da SPR Auto que destacam produtos e marcas como Valvoline, Mannol e Ecotec, desenhados para chamar a atenção para a oferta em destaque.",
            "Flyers de promoção de produtos: baterias ZAP, lubrificantes, escovas e lâmpadas e carros de ferramentas.",
            "Publicações para as redes sociais com conteúdo útil para automobilistas, de datas comemorativas a conselhos de manutenção.",
            "Etiqueta de próxima revisão e cartão de revisão, com data, quilómetros, tipo de óleo e a lista de filtros a verificar: uma peça que mantém a marca presente no veículo e lembra o cliente da revisão seguinte.",
            "Reel publicado no Instagram da SPR – Peças e Acessórios Auto. Ao clicar no botão de play da capa, abre o reel no Instagram."] },
      "studio-33": {

      "rar-acucar": {
        ctx: "Para o Dia Mundial da Criança, a RAR Açúcar precisava de um flyer que servisse de convite, de guia da visita à fábrica e de documento de regras, num só objeto.",
        did: "Concebi um flyer de duas faces: o interior é um mapa interativo da visita à fábrica, com descrições curtas e envolventes em cada paragem; o exterior mantém uma linha gráfica simples e atrativa e apresenta as regras de visita de forma clara e acessível.",
