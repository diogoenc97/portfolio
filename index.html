<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Portefólio Diogo Encarnação</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Diogo Encarnação, designer gráfico e gestor de marketing em Vila Nova de Gaia. Design gráfico, branding, marketing e gestão de projetos.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* Layout: página inicial com apresentação, botões coloridos e uma faixa por projeto.
     Página de projeto no estilo de galeria do Behance: título, coluna principal com os módulos
     (imagem + texto) e painel lateral fixo com contacto, informação, ferramentas e índice.
     Para formatar: altere as cores e fontes abaixo e os dados na lista PROJECTS no fim do ficheiro. */
  :root {
    --bg: #f3f4f5;
    --surface: #ffffff;
    --fg: #0b0c0e;
    --muted: #59636d;
    --accent: #0a6fb0;
    --accent-ink: #ffffff;
    --line: #d7dbde;
    --shadow: 0 1px 2px rgba(13, 34, 55, .10), 0 14px 36px rgba(13, 34, 55, .16);

    --font-display: "Bricolage Grotesque", "Helvetica Neue", Arial, sans-serif;
    --font-body: "Instrument Sans", "Helvetica Neue", Arial, sans-serif;

    --maxw: 1240px;
    --radius: 10px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0b0c0e; --surface: #16181b; --fg: #f3f4f5; --muted: #9aa4ad;
      --accent: #4cc3e0; --accent-ink: #06202b; --line: #26292d;
      --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 14px 36px rgba(0, 0, 0, .45);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0b0c0e; --surface: #16181b; --fg: #f3f4f5; --muted: #9aa4ad;
    --accent: #4cc3e0; --accent-ink: #06202b; --line: #26292d;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 14px 36px rgba(0, 0, 0, .45);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 16px; line-height: 1.55; margin: 0; padding: 0; }
  a { color: inherit; }
  button { font: inherit; }
  :focus-visible { outline: 3px solid currentColor; outline-offset: 3px; border-radius: 4px; }

  .in { max-width: var(--maxw); margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

  /* Topo (fixo ao fazer scroll) */
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: inherit; }
  .hdr { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); border-bottom: 1px solid color-mix(in srgb, currentColor 14%, transparent); }
  .stage .hdr { background: var(--c2); }
  .nav { display: flex; gap: 6px; }
  .nav button { background: transparent; border: 0; color: inherit; cursor: pointer; font-weight: 500; padding: 8px 10px; border-radius: 8px; }
  .nav button:hover { text-decoration: underline; text-underline-offset: 4px; }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-block: 18px; }
  .brand { font-family: var(--font-display); font-weight: 800; letter-spacing: .01em; text-decoration: none; font-size: 1.05rem; }
  .top-right { display: flex; align-items: center; gap: 18px; }
  .lang { display: inline-flex; align-items: center; gap: 2px; padding: 3px; border-radius: 999px; border: 1px solid color-mix(in srgb, currentColor 28%, transparent); }
  .lang button { background: transparent; border: 0; color: inherit; cursor: pointer; font: inherit; font-size: .78rem; font-weight: 600; letter-spacing: .08em; padding: 5px 10px; border-radius: 999px; opacity: .65; }
  .lang button:hover { opacity: 1; }
  .lang button[aria-pressed="true"] { opacity: 1; background: color-mix(in srgb, currentColor 16%, transparent); }
  .top-right .tag { opacity: .7; font-size: .8rem; letter-spacing: .1em; text-transform: uppercase; }

  /* Botões */
  .cta {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 0; cursor: pointer; text-decoration: none;
    font-weight: 600; font-size: .95rem; padding: 11px 20px; border-radius: 999px;
    background: var(--accent); color: var(--accent-ink); transition: transform .15s ease, filter .15s ease;
  }
  .cta:hover { transform: translateY(-2px); filter: brightness(1.1); }
  .cta.block { width: 100%; }

  /* Cor de cada projeto: --c1/--c2 (fundo), --ink (texto) */
  .tinted { background: linear-gradient(135deg, var(--c1), var(--c2)); color: var(--ink); }
  .tinted .btn, .btn {
    display: inline-flex; align-items: center; gap: 8px; text-decoration: none; font-weight: 600; font-size: .95rem;
    padding: 12px 20px; border-radius: 999px; background: var(--ink); color: var(--c1); transition: transform .15s ease, filter .15s ease;
  }
  .btn:hover { transform: translateY(-2px); filter: brightness(1.12); }

  /* Página inicial: tipografia enorme, base neutra, a cor vem só dos projetos */
  :root { --font-poster: "Anton", "Impact", "Arial Narrow", sans-serif; }
  .wide { max-width: 1680px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .hm-k { margin: 0; font-size: .78rem; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  .hm-h { font-family: var(--font-poster); font-weight: 400; text-transform: uppercase; font-size: clamp(3.2rem, 11vw, 9.5rem); line-height: .92; letter-spacing: -.005em; margin: 0; }
  .hm-sec { padding-block: clamp(64px, 9vw, 120px); scroll-margin-top: 70px; }

  /* Entrada */
  .hm-hero { padding-block: 26px 48px; }
  .hm-meta { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 6px 16px; }
  .hm-name { font-family: var(--font-poster); font-weight: 400; text-transform: uppercase; font-size: clamp(2.8rem, 13.6vw, 14.4rem); line-height: .92; letter-spacing: -.01em; margin: clamp(20px, 4vw, 48px) 0 0; white-space: nowrap; }
  .hm-name .n { display: inline-block; }
  .hm-name .n + .n { margin-left: .22em; }
  .hm-name .ch { display: inline-block; animation: rise .9s cubic-bezier(.2, .7, .2, 1) backwards; animation-delay: calc(var(--i) * 45ms); }
  @keyframes rise { from { transform: translateY(.28em); } }
  .hm-bot { display: flex; align-items: flex-end; justify-content: space-between; gap: 32px; margin-top: clamp(24px, 4vw, 44px); }
  .hm-lead { margin: 0; max-width: 44ch; font-size: clamp(1.1rem, 1.9vw, 1.4rem); line-height: 1.45; text-wrap: pretty; }
  .hm-badge { flex: none; position: relative; width: clamp(104px, 11vw, 136px); aspect-ratio: 1; border: 0; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; cursor: pointer; }
  .hm-badge svg { position: absolute; inset: 0; width: 100%; height: 100%; transition: transform .9s cubic-bezier(.2, .7, .2, 1); }
  .hm-badge text { fill: currentColor; font: 600 10.5px var(--font-body); letter-spacing: .06em; }
  .hm-badge i { font-style: normal; font-size: 1.7rem; line-height: 1; transition: transform .3s ease; }
  .hm-badge:hover svg { transform: rotate(140deg); }
  .hm-badge:hover i { transform: translateY(5px); }

  /* Tira de capas */
  .hm-strip { overflow: hidden; padding-block: 8px 24px; }
  .hm-track { display: flex; gap: 16px; width: max-content; animation: slide 80s linear infinite; }
  .hm-strip:hover .hm-track { animation-play-state: paused; }
  .hm-cv { display: block; flex: none; }
  .hm-cv img { display: block; width: auto; height: clamp(140px, 19vw, 240px); }
  @keyframes slide { to { transform: translateX(calc(-50% - 8px)); } }

  /* Palavras-chave */
  .hm-kw { overflow: hidden; border-block: 1px solid var(--line); padding-block: clamp(10px, 1.6vw, 20px); margin-block: 8px clamp(20px, 3vw, 36px); }
  .hm-kwt { display: flex; width: max-content; animation: slide2 50s linear infinite; }
  .hm-kwt span { flex: none; display: inline-flex; align-items: center; gap: clamp(18px, 3vw, 44px); padding-right: clamp(18px, 3vw, 44px); font-family: var(--font-poster); text-transform: uppercase; font-size: clamp(2.2rem, 6.4vw, 6rem); line-height: 1.05; white-space: nowrap; }
  .hm-kwt b { font-weight: 400; }
  .hm-kwt b:nth-child(even) { color: transparent; -webkit-text-stroke: 1.5px var(--fg); }
  .hm-kwt i { font-style: normal; color: var(--accent); font-size: .6em; }
  @keyframes slide2 { to { transform: translateX(-50%); } }

  /* Animações simples nas páginas de projeto */
  .pw { display: inline-block; overflow: hidden; vertical-align: top; padding-bottom: .12em; margin-bottom: -.12em; }
  .pw > span { display: inline-block; animation: wordup .8s cubic-bezier(.2, .7, .2, 1) backwards; animation-delay: calc(.1s + var(--i) * 90ms); }
  @keyframes wordup { from { transform: translateY(108%); } }
  @keyframes wipe { from { clip-path: inset(0 0 100% 0); } to { clip-path: inset(-40px); } }
  @keyframes zoomout { from { transform: scale(1.12); } }
  .hero-img .shot-btn { animation: wipe 1.1s .25s cubic-bezier(.2, .7, .2, 1) backwards; }
  .hero-img .shot-btn img { animation: zoomout 1.6s .25s cubic-bezier(.2, .7, .2, 1) backwards; }
  .module .shot-btn.rv { opacity: 1; transform: none; clip-path: inset(0 0 100% 0); transition: clip-path 1s cubic-bezier(.2, .7, .2, 1); }
  .module .shot-btn.rv.vis { clip-path: inset(-40px); }
  .module .shot-btn.rv img { transform: scale(1.12); }
  .module .shot-btn.rv.vis img { transform: scale(1); transition: transform 1.4s cubic-bezier(.2, .7, .2, 1); }
  .module .shot-btn.rv.vis:hover img { transform: scale(1.025); transition-duration: .6s; }
  .module h2.rv { transform: translateX(-28px); }
  .module h2.rv.vis { transform: none; }
  .module h2::after { content: ""; display: block; height: 3px; width: 0; margin-top: 12px; background: currentColor; opacity: .85; transition: width .9s .3s cubic-bezier(.2, .7, .2, 1); }
  .module h2.vis::after { width: 56px; }
  @keyframes up { from { opacity: 0; transform: translateY(18px); } }
  @keyframes fadein { from { opacity: 0; } }
  .back, .proj-head .sub, .aside { animation: up .6s cubic-bezier(.2, .7, .2, 1) backwards; }
  .proj-head .sub { animation-delay: .16s; }
  .aside { animation-delay: .25s; }
  .tools li { animation: fadein .5s backwards; animation-delay: calc(.35s + var(--i, 0) * 50ms); }
  .rv { opacity: 0; transform: translateY(26px); transition: opacity .7s ease, transform .7s cubic-bezier(.2, .7, .2, 1); }
  .rv.vis { opacity: 1; transform: none; }
  .shot-btn img { transition: transform .6s cubic-bezier(.2, .7, .2, 1); }
  .shot-btn:hover img { transform: scale(1.025); }
  .pager a { transition: background-color .25s ease, color .25s ease, transform .25s ease; }
  .pager a:hover { transform: translateY(-3px); }
  .prog { position: fixed; left: 0; right: 0; top: env(safe-area-inset-top, 0px); height: 3px; z-index: 30; background: var(--ink, var(--fg)); transform: scaleX(0); transform-origin: 0 50%; pointer-events: none; }

  /* Lista de trabalho: ao passar o rato a página muda para a cor do projeto */
  .hm-works { --fl: var(--bg); --fi: var(--fg); background: var(--bg); color: var(--fg); padding-block: clamp(56px, 8vw, 104px); scroll-margin-top: 60px; transition: background-color .5s ease, color .5s ease; }
  .hm-works.on { background: var(--fl); color: var(--fi); }
  .hm-whead { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: clamp(20px, 3vw, 40px); }
  .hm-hint { margin: 0; font-size: .85rem; opacity: .7; text-align: right; max-width: 24ch; }
  .hm-hint .t { display: none; }
  .hm-list { border-bottom: 1px solid color-mix(in srgb, currentColor 22%, transparent); }
  .hm-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "t y" "m m"; align-items: baseline; gap: 2px 24px; padding-block: clamp(14px, 2vw, 24px); border-top: 1px solid color-mix(in srgb, currentColor 22%, transparent); color: inherit; text-decoration: none; transition: opacity .3s ease; }
  .hm-rt { grid-area: t; font-family: var(--font-poster); font-weight: 400; text-transform: uppercase; font-size: clamp(2.6rem, 9.4vw, 8.6rem); line-height: .98; letter-spacing: -.005em; transition: transform .4s cubic-bezier(.2, .7, .2, 1); }
  .hm-ry { grid-area: y; font-size: .95rem; font-variant-numeric: tabular-nums; opacity: .8; }
  .hm-rm { grid-area: m; font-size: .95rem; opacity: .75; }
  .hm-th { display: none; grid-area: i; }
  .hm-works.on .hm-row:not(.act) { opacity: .55; }
  .hm-row.act .hm-rt { transform: translateX(clamp(8px, 1.6vw, 28px)); }
  .hm-peek { position: fixed; left: 0; top: 0; z-index: 25; width: clamp(240px, 28vw, 420px); aspect-ratio: 16 / 10; overflow: hidden; pointer-events: none; opacity: 0; transition: opacity .2s ease; will-change: transform; box-shadow: 0 22px 50px rgba(0, 0, 0, .35); }
  .hm-peek.vis { opacity: 1; }
  .hm-peek img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity .25s ease; }
  .hm-peek img.show { opacity: 1; }

  /* O que faço */
  .hm-srv-list { margin-top: clamp(24px, 3vw, 40px); border-bottom: 1px solid color-mix(in srgb, currentColor 22%, transparent); }
  .hm-srv { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 12px 48px; padding-block: 28px; border-top: 1px solid color-mix(in srgb, currentColor 22%, transparent); }
  .hm-srv h3 { font-family: var(--font-poster); font-weight: 400; text-transform: uppercase; font-size: clamp(1.9rem, 3.8vw, 3rem); line-height: 1; margin: 0; }
  .hm-srv p { margin: 0 0 12px; max-width: 52ch; font-size: 1.05rem; color: var(--muted); }
  .hm-srv .lk { display: flex; flex-wrap: wrap; gap: 4px 16px; }
  .hm-srv .lk a { font-weight: 600; font-size: .95rem; color: var(--accent); text-underline-offset: 3px; }

  /* Sobre */
  .hm-st { font-family: var(--font-display); font-weight: 600; font-size: clamp(1.7rem, 4.3vw, 3.4rem); line-height: 1.12; letter-spacing: -.015em; margin: 22px 0 0; max-width: 24em; }
  .hm-st .w { color: var(--muted); transition: color .3s ease; }
  .hm-st .w.on { color: var(--fg); }
  .hm-two { display: grid; grid-template-columns: minmax(0, 7fr) minmax(0, 5fr); gap: 48px; margin-top: clamp(40px, 6vw, 72px); align-items: start; }
  .hm-two p { margin: 0 0 16px; max-width: 60ch; font-size: 1.1rem; line-height: 1.75; }
  .hm-exp { margin: 0; padding: 0; list-style: none; border-bottom: 1px solid color-mix(in srgb, currentColor 22%, transparent); }
  .hm-exp li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 16px; padding-block: 14px; border-top: 1px solid color-mix(in srgb, currentColor 22%, transparent); }
  .hm-exp b { font-weight: 600; }
  .hm-exp span { color: var(--muted); font-size: .92rem; }
  .hm-exp .yr { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .hm-nums { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 24px; margin-top: clamp(48px, 7vw, 96px); }
  .hm-num { display: block; font-family: var(--font-poster); font-weight: 400; font-size: clamp(3.2rem, 7.4vw, 6.4rem); line-height: 1; color: var(--accent); font-variant-numeric: tabular-nums; }
  .hm-nl { display: block; margin-top: 8px; max-width: 22ch; font-size: .9rem; color: var(--muted); }
  .hm-facts { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 32px; margin-top: clamp(48px, 7vw, 96px); }
  .hm-facts .label { font-size: .78rem; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin: 0 0 12px; }
  .hm-facts .tools li { border-color: var(--line); }

  /* Contacto */
  .hm-contact { background: var(--fg); color: var(--bg); padding-block: clamp(72px, 10vw, 140px) 36px; }
  .hm-contact .hm-k { color: color-mix(in srgb, var(--bg) 62%, transparent); }
  .hm-big { font-family: var(--font-poster); font-weight: 400; text-transform: uppercase; font-size: clamp(4.4rem, 20vw, 20rem); line-height: .86; letter-spacing: -.01em; margin: 18px 0 0; }
  .hm-mail { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 18px; margin-top: clamp(28px, 4vw, 48px); }
  .hm-mail .v { font-family: var(--font-display); font-weight: 600; font-size: clamp(1.3rem, 4.2vw, 2.6rem); letter-spacing: -.01em; overflow-wrap: anywhere; user-select: all; }
  .hm-contact .mini { color: var(--bg); border-color: var(--bg); }
  .hm-contact .mini:hover { background: var(--bg); color: var(--fg); }
  .hm-contact .cta { background: var(--bg); color: var(--fg); margin-top: 22px; }
  .hm-phone { margin: 10px 0 0; font-size: 1.1rem; opacity: .8; }
  .hm-foot { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px 16px; margin-top: clamp(56px, 8vw, 110px); font-size: .88rem; opacity: .65; }

  /* Página de projeto (estrutura de galeria do Behance) */
  .stage { min-height: 100vh; background: var(--c2); color: var(--ink); }
  .stage .cta { background: var(--ink); color: var(--c2); }
  .back { display: inline-flex; align-items: center; gap: 8px; margin: 8px 0 0; padding: 9px 16px; border-radius: 999px; border: 2px solid var(--ink); color: var(--ink); font-weight: 600; text-decoration: none; font-size: .9rem; }
  .back:hover { background: var(--ink); color: var(--c2); }
  .proj-head { padding-block: 28px 32px; }
  .proj-head h1 { font-size: clamp(2.2rem, 6vw, 4rem); margin-bottom: 10px; }
  .sub { margin: 0; font-size: 1.1rem; opacity: .85; max-width: 60ch; }
  .layout { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 40px; align-items: start; padding-bottom: 24px; }
  .main { min-width: 0; }
  .hero-img { margin: 0 0 40px; }
  .about { margin: 0 0 56px; max-width: 68ch; }
  .about h2, .label { font-size: .78rem; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; opacity: .7; margin: 0 0 10px; }
  .about p { margin: 0; font-size: 1.12rem; line-height: 1.75; }
  .module { margin: 0 0 64px; scroll-margin-top: 90px; }
  .group-label { display: block; font-size: .78rem; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; opacity: .7; margin: 0 0 6px; }
  .module h2 { font-family: var(--font-display); font-weight: 800; font-size: clamp(1.6rem, 3.2vw, 2.4rem); line-height: 1.08; margin: 0 0 18px; letter-spacing: -.01em; text-wrap: balance; }
  .shots { display: flex; flex-direction: column; gap: 18px; }
  .shot-btn { display: block; width: 100%; padding: 0; border: 0; background: transparent; cursor: zoom-in; border-radius: 6px; overflow: hidden; box-shadow: 0 10px 30px rgba(0, 0, 0, .22); }
  .shot-btn img { display: block; width: 100%; height: auto; }
  .module p.txt { margin: 20px 0 0; font-size: 1.08rem; line-height: 1.75; max-width: 66ch; }
  .module.split .body { display: grid; grid-template-columns: minmax(0, 7fr) minmax(0, 5fr); gap: 32px; align-items: center; }
  .module.split p.txt { margin: 0; }
  .module p.txt.solo { margin-top: 0; }

  .aside { position: sticky; top: 88px; display: flex; flex-direction: column; gap: 18px; padding: 22px; border-radius: 14px; background: color-mix(in srgb, var(--ink) 15%, var(--c2)); border: 1px solid color-mix(in srgb, var(--ink) 30%, transparent); box-shadow: 0 12px 32px rgba(0, 0, 0, .25); }
  .aside .who strong { display: block; font-family: var(--font-display); font-weight: 800; font-size: 1.25rem; line-height: 1.15; }
  .aside .who span { opacity: .75; font-size: .92rem; }
  .info-list { margin: 0; display: grid; gap: 12px; }
  .info-list div { display: grid; gap: 2px; }
  .info-list dt { font-size: .74rem; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; opacity: .65; }
  .info-list dd { margin: 0; font-weight: 500; }
  .tools { display: flex; flex-wrap: wrap; gap: 8px; margin: 0; padding: 0; list-style: none; }
  .tools li { padding: 5px 12px; border-radius: 999px; font-size: .86rem; font-weight: 500; border: 1.5px solid color-mix(in srgb, var(--ink) 45%, transparent); }
  .toc { display: flex; flex-direction: column; gap: 2px; }
  .toc .grp { font-size: .74rem; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; opacity: .6; margin: 8px 0 2px; }
  .toc button { text-align: left; background: transparent; border: 0; color: inherit; cursor: pointer; padding: 5px 0; font-size: .95rem; }

          if (!e.isIntersecting) return;
          io.unobserve(e.target);
          var el = e.target, to = +el.dataset.to, pre = el.dataset.pre || "", suf = el.dataset.suf || "", t0 = performance.now();
          var f = function (t) {
            var p = Math.min(1, (t - t0) / 1100), ease = 1 - Math.pow(1 - p, 3);
            el.textContent = pre + Math.round(to * ease) + suf;
            if (p < 1) requestAnimationFrame(f);
          };
          requestAnimationFrame(f);
        });
      }, { threshold: 0.6 });
      nums.forEach(function (n) { io.observe(n); });
      cleanups.push(function () { io.disconnect(); });
    }
  }

  var current = [];
  function project(i) {
    var p = loc(PROJECTS[i]);
    document.title = p.name + " · Diogo Encarnação";
    setBg(p.pg);
    current = [p.cover];
    var mods = p.modules.map(function (m, k) {
      var shots = m.imgs.map(function (n, j) {
        current.push(n);
        return '<button class="shot-btn" type="button" data-n="' + n + '" aria-label="' + t("zoom") + '">' + imgTag(n, p.name + " · " + m.title + (m.imgs.length > 1 ? " (" + (j + 1) + ")" : "")) + '</button>';
      }).join("");
      var inner = shots ? '<div class="shots">' + shots + '</div>' : '';
      var txt = m.text ? '<p class="txt' + (shots ? '' : ' solo') + '">' + hl(m.text) + '</p>' : '';
      var body = m.split ? '<div class="body"><div class="shots">' + shots + '</div>' + txt + '</div>' : inner + txt;
      return '<section class="module' + (m.split ? ' split' : '') + '" id="m' + k + '">' +
        (m.group ? '<span class="group-label">' + esc(m.group) + '</span>' : '') +
        '<h2>' + esc(m.title) + '</h2>' + body + '</section>';
    }).join("");

    var info = '<div><dt>' + t("company") + '</dt><dd>' + esc(p.empresa) + '</dd></div>' +
      '<div><dt>' + t("project") + '</dt><dd>' + esc(p.kind) + '</dd></div>' +
      (p.cargo ? '<div><dt>' + t("role") + '</dt><dd>' + esc(p.cargo) + '</dd></div>' : '') +
      (p.skills ? '<div><dt>' + t("skillsDt") + '</dt><dd>' + esc(p.skills) + '</dd></div>' : '') +
      '<div><dt>' + t("date") + '</dt><dd>' + esc(p.year) + '</dd></div>';
    var tools = p.tools.length ? '<div><p class="label">' + t("toolsK") + '</p><ul class="tools">' + p.tools.map(function (t) { return '<li>' + esc(t) + '</li>'; }).join("") + '</ul></div>' : '';
    var lastGroup = "";
    var toc = p.modules.map(function (m, k) {
      var g = "";
      if (m.group && m.group !== lastGroup) g = '<span class="grp">' + esc(m.group) + '</span>';
      lastGroup = m.group || "";
      return g + '<button type="button" data-jump="m' + k + '">' + esc(m.title) + '</button>';
    }).join("");

    var prev = PROJECTS[i - 1], next = PROJECTS[i + 1];
    app.innerHTML = '<div class="stage" style="' + stageVars(p) + '">' + topbar(false) +
      '<div class="in"><a class="back" href="#inicio">' + t("back") + '</a>' +
      '<section class="proj-head"><h1 aria-label="' + esc(p.name) + '">' + p.name.split(" ").map(function (w, n) { return '<span class="pw" aria-hidden="true"><span style="--i:' + n + '">' + esc(w) + '</span></span>'; }).join(" ") + '</h1><p class="sub">' + hl(p.kind) + '</p></section>' +
      '<div class="layout"><main class="main">' +
        '<div class="hero-img"><button class="shot-btn" type="button" data-n="' + p.cover + '" aria-label="' + t("zoom") + '">' + imgTag(p.cover, p.name, true) + '</button></div>' +
        (p.desc ? '<section class="about"><h2>' + t("aboutProj") + '</h2><p>' + hl(p.desc) + '</p></section>' : '') +
        mods +
        '<nav class="pager" aria-label="' + t("others") + '">' +
          (prev ? '<a href="#' + prev.id + '"><small>' + t("prev") + '</small><strong>' + esc(prev.short || prev.name) + '</strong></a>' : '<span></span>') +
          (next ? '<a class="next" href="#' + next.id + '"><small>' + t("next") + '</small><strong>' + esc(next.short || next.name) + '</strong></a>' : '') +
        '</nav></main>' +
        '<aside class="aside"><div class="who"><strong>Diogo Encarnação</strong><span>' + t("tag") + '</span></div>' +
          '<button class="cta block" type="button" data-contact>' + t("contact") + '</button>' +
          '<dl class="info-list">' + info + '</dl>' + tools +
          '<div class="toc-box"><p class="label">' + t("inProj") + '</p><nav class="toc" aria-label="' + t("toc") + '">' + toc + '</nav></div>' +
        '</aside></div></div>' +
      '<footer><div class="in">' + t("foot1") + '</div></footer></div>';
  }

  function initProject() {
    var stage = document.querySelector(".stage");
    var bar = document.createElement("div"); bar.className = "prog"; stage.appendChild(bar);
    var tick = false;
    function upd() { tick = false; var m = document.documentElement.scrollHeight - innerHeight; bar.style.transform = "scaleX(" + (m > 0 ? Math.min(1, scrollY / m) : 0) + ")"; }
    on(window, "scroll", function () { if (!tick) { tick = true; requestAnimationFrame(upd); } }, { passive: true });
    [].forEach.call(stage.querySelectorAll(".tools li"), function (el, n) { el.style.setProperty("--i", n % 12); });
    var els = [].slice.call(stage.querySelectorAll(".about, .module h2, .group-label, .module .shot-btn, .module p.txt, .pager"));
    if (!("IntersectionObserver" in window) || matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    var io = new IntersectionObserver(function (es) {
      es.forEach(function (e) { if (e.isIntersecting) { e.target.classList.add("vis"); io.unobserve(e.target); } });
    }, { rootMargin: "0px 0px -6% 0px", threshold: 0 });
    els.forEach(function (el) { el.classList.add("rv"); io.observe(el); });
    cleanups.push(function () { io.disconnect(); });
  }

  function route() {
    cleanups.forEach(function (f) { f(); }); cleanups = [];
    var id = (location.hash || "").replace("#", "");
    var i = PROJECTS.findIndex(function (p) { return p.id === id; });
    if (i >= 0) { project(i); initProject(); } else { home(); initHome(); }
    window.scrollTo(0, 0);
  }
  window.addEventListener("hashchange", route);
  applyStatic();
  route();

  // Ampliação
  var lb = document.getElementById("lightbox"), lbImg = document.getElementById("lb-img");
  function openLb(n) { lbImg.src = src(n); lb.hidden = false; lb.dataset.n = n; document.getElementById("lb-close").focus(); }
  function closeLb() { lb.hidden = true; lbImg.removeAttribute("src"); }
  lb.addEventListener("click", closeLb);

  // Contacto
  var modal = document.getElementById("modal");
  function copy(text, btn) {
    var done = function () { var old = btn.textContent; btn.textContent = t("copied"); setTimeout(function () { btn.textContent = old; }, 1600); };
    try { navigator.clipboard.writeText(text).then(done, function () { selectText(btn); }); } catch (e) { selectText(btn); }
  }
  function selectText(btn) {
    var v = (btn.closest(".crow") || btn.closest(".copy-wrap")).querySelector(".v"), r = document.createRange();
    r.selectNodeContents(v); var s = getSelection(); s.removeAllRanges(); s.addRange(r);
  }
  function row(label, value, actions) {
    return '<div class="crow"><span class="k">' + label + '</span><span class="v">' + esc(value) + '</span><span class="act">' + actions + '</span></div>';
  }
  function applyStatic() {
    document.documentElement.lang = LANG === "en" ? "en" : "pt-PT";
    document.getElementById("lb-close").setAttribute("aria-label", t("close"));
    document.getElementById("modal-close").setAttribute("aria-label", t("close"));
    document.getElementById("modal-title").textContent = t("mTitle");
    document.getElementById("modal-lead").textContent = t("mLead");
    var md = document.querySelector('meta[name="description"]');
    if (md) md.setAttribute("content", LANG === "en" ? "Diogo Encarnação, graphic designer and marketing manager in Vila Nova de Gaia. Graphic design, branding, marketing and project management." : "Diogo Encarnação, designer gráfico e gestor de marketing em Vila Nova de Gaia. Design gráfico, branding, marketing e gestão de projetos.");
  }
  function setLang(l) {
    if (l === LANG) return;
    LANG = l;
    try { localStorage.setItem("lang", l); } catch (e) {}
    applyStatic();
    var y = window.scrollY;
    route();
    window.scrollTo(0, y);
  }
  function openModal() {
    var rows = "";
    if (CONTACT.email) rows += row("Email", CONTACT.email, '<button class="mini" type="button" data-copy="' + esc(CONTACT.email) + '">' + t("copy") + '</button><a class="mini" href="mailto:' + esc(CONTACT.email) + '">' + t("write") + '</a>');
    if (CONTACT.phone) rows += row(t("phone"), CONTACT.phone, '<button class="mini" type="button" data-copy="' + esc(CONTACT.phone) + '">' + t("copy") + '</button>');
    if (CONTACT.linkedin) rows += row("LinkedIn", CONTACT.linkedin.replace(/^https?:\/\/(www\.)?/, ""), '<a class="mini" href="' + esc(CONTACT.linkedin) + '" target="_blank" rel="noopener">' + t("open") + '</a>');
    document.getElementById("contact-rows").innerHTML = rows;
    modal.hidden = false;
    document.getElementById("modal-close").focus();
  }
  function closeModal() { modal.hidden = true; }
  modal.addEventListener("click", function (e) { if (e.target === modal) closeModal(); });
  document.getElementById("modal-close").addEventListener("click", closeModal);

  document.addEventListener("click", function (e) {
    var t = e.target;
    var lg = t.closest("[data-lang]"); if (lg) { setLang(lg.dataset.lang); return; }
    if (t.closest("[data-contact]")) { openModal(); return; }
    if (t.closest(".brand") && (location.hash === "#inicio" || location.hash === "")) { window.scrollTo({ top: 0, behavior: "smooth" }); }
    var c = t.closest("[data-copy]"); if (c) { copy(c.dataset.copy, c); return; }
    var j = t.closest("[data-jump]");
    if (j) { var el = document.getElementById(j.dataset.jump); if (el) el.scrollIntoView({ behavior: "smooth", block: "start" }); return; }
    var b = t.closest(".shot-btn"); if (b) openLb(+b.dataset.n);
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") { if (!modal.hidden) closeModal(); else if (!lb.hidden) closeLb(); return; }
    if (lb.hidden) return;
    var k = current.indexOf(+lb.dataset.n);
    if (e.key === "ArrowRight" && k < current.length - 1) openLb(current[k + 1]);
    if (e.key === "ArrowLeft" && k > 0) openLb(current[k - 1]);
  });
</script>

</body></html>
